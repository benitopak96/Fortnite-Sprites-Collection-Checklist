  ALL_VARIANTS_MAP[id].forEach(v => { DEFAULT_STATE.inventory[id][v] = 0; });
});

const LEGACY_KEY = "sprite-checklist-state-v15";
const MULTI_STORAGE_KEY = "sprite-checklist-multi-v1"; 

let appState = { activeId: "default", profiles: { "default": JSON.parse(JSON.stringify(DEFAULT_STATE)) } };
let state = null;
let touchTimer = null;
let isLongPress = false;

// All gem sprites have now been released — nothing is flagged as unreleased anymore.
function isUnreleased(spriteId, variant) {
  return false;
}

// --- API SYNC ENGINE ---
function syncToVPS() {
  const user = JSON.parse(localStorage.getItem("discord_user"));
  if (!user) return; 

  fetch("https://sapi.tyrantnetworks.com/api/sprites/save", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ user_id: user.user_id, collection_data: [appState] })
  }).catch(e => console.error("Database sync failed:", e));
}

function loadState() {
  const savedMulti = localStorage.getItem(MULTI_STORAGE_KEY);
  if (savedMulti) {
    appState = JSON.parse(savedMulti);
  } else {
    const legacySaved = localStorage.getItem(LEGACY_KEY);
    if (legacySaved) appState.profiles["default"].inventory = JSON.parse(legacySaved);
  }

  Object.keys(appState.profiles).forEach(profId => {
    let prof = appState.profiles[profId];
    if (!prof.sortMode) prof.sortMode = "organize";
    if (prof.showUnreleased === undefined) prof.showUnreleased = true;
    Object.keys(ALL_VARIANTS_MAP).forEach(id => {
      if (!prof.inventory[id]) prof.inventory[id] = {};
      ALL_VARIANTS_MAP[id].forEach(v => { if (prof.inventory[id][v] === undefined) prof.inventory[id][v] = 0; });
    });
  });
  
  state = appState.profiles[appState.activeId];
  render();

  const user = JSON.parse(localStorage.getItem("discord_user"));
  if (user) {
    fetch(`https://sapi.tyrantnetworks.com/api/sprites/${user.user_id}`)
      .then(res => res.json())
      .then(data => {
        if (data.collection_data && data.collection_data.length > 0) {
          appState = data.collection_data[0];
          state = appState.profiles[appState.activeId];
          localStorage.setItem(MULTI_STORAGE_KEY, JSON.stringify(appState));
          render();
        }
      }).catch(e => console.error("VPS Load error:", e));
  }
}

function saveState() {
  try {
    appState.profiles[appState.activeId] = state;
    localStorage.setItem(MULTI_STORAGE_KEY, JSON.stringify(appState));
    syncToVPS();
  } catch (e) { console.error("Failed to save state:", e); }
}

// MULTI-SHEET & CONTROLS
function newSheet() {
  const name = prompt("Enter a name for this new sheet (e.g., Friend's Username):");
  if (!name || name.trim() === "") return;
  const id = "sheet_" + Date.now().toString();
  appState.profiles[id] = JSON.parse(JSON.stringify(DEFAULT_STATE));
  appState.profiles[id].username = name.trim();
  appState.activeId = id;
  state = appState.profiles[id];
  saveState();
  render();
}

function switchSheet(id) {
  appState.activeId = id;
  state = appState.profiles[id];
  saveState(); 
  render();
}

function updateSortMode(mode) {
  state.sortMode = mode;
  saveState();
  render();
}

function toggleUnreleased() {
  state.showUnreleased = document.getElementById("unreleasedToggle").checked;
  saveState();
  render();
}

function deleteSheet() {
  if (Object.keys(appState.profiles).length <= 1) {
    alert("You cannot delete your only sheet. You can use the 'Reset all' button below instead.");
    return;
  }
  const activeName = state.username || "this unnamed sheet";
  if (!confirm(`Are you sure you want to permanently delete ${activeName}?`)) return;
  delete appState.profiles[appState.activeId];
  appState.activeId = Object.keys(appState.profiles)[0];
  state = appState.profiles[appState.activeId];
  saveState();
  render();
}

// INVENTORY CONTROLS
function handleTileTap(spriteId, variant) {
  if (isLongPress) return;
  let currentLevel = state.inventory[spriteId][variant] || 0;
  let nextLevel = currentLevel + 1;
  if (nextLevel > 5) nextLevel = 0;
  state.inventory[spriteId][variant] = nextLevel;
  saveState();
  render();
}

function handleLongPress(spriteId, variant) {
  state.inventory[spriteId][variant] = 5;
  saveState();
  render();
}

function maxEntireRow(spriteId, activeVariants) {
  activeVariants.forEach(v => { state.inventory[spriteId][v] = 5; });
  saveState();
  render();
}

function setupTouchListeners(element, spriteId, variant) {
  const startHandler = (e) => {
    isLongPress = false;
    touchTimer = setTimeout(() => {
      isLongPress = true;
      handleLongPress(spriteId, variant);
    }, 400);
  };
  const endHandler = (e) => {
    if (touchTimer) clearTimeout(touchTimer);
    if (!isLongPress) handleTileTap(spriteId, variant);
  };
  const cancelHandler = () => { if (touchTimer) clearTimeout(touchTimer); };

  element.addEventListener('touchstart', startHandler, { passive: true });
  element.addEventListener('touchend', endHandler);
  element.addEventListener('touchmove', cancelHandler, { passive: true });
  element.addEventListener('mousedown', startHandler);
  element.addEventListener('mouseup', endHandler);
  element.addEventListener('mouseleave', cancelHandler);
}

function updateUsername(newName) {
  state.username = newName;
  saveState();
  const staticBlock = document.getElementById("username-mirror");
  if(staticBlock) staticBlock.innerText = newName || "PLAYER";
  const ctaName = document.getElementById("cta-username");
  if(ctaName) ctaName.innerText = newName || "[Input Username]";
}

function resetAll() {
  if (!confirm("Clear this checklist and reset all levels to zero?")) return;
  Object.keys(DEFAULT_STATE.inventory).forEach(id => {
    state.inventory[id] = JSON.parse(JSON.stringify(DEFAULT_STATE.inventory[id]));
  });
  saveState();
  render();
}

function exportAsImage() {
  const targetElement = document.getElementById("capture-area");
  const exportBtn = document.querySelector(".export-btn");
  exportBtn.innerText = "Generating Share Screen...";
  targetElement.classList.add("social-export-mode");
  
  setTimeout(() => {
    html2canvas(targetElement, {
      useCORS: true, allowTaint: true, scale: 2, backgroundColor: "#0b0e14", width: 580, logging: false
    }).then(canvas => {
      const nameString = state.username ? state.username.replace(/\s+/g, '_') : 'My';
      const fileName = `${nameString}_Fortnite_Sprite_Checklist.png`;
      canvas.toBlob(blob => {
        const imageFile = new File([blob], fileName, { type: "image/png" });
        if (navigator.canShare && navigator.canShare({ files: [imageFile] })) {
          navigator.share({
            files: [imageFile], title: 'My Sprite Collection Checklist', text: 'Check out my current Fortnite Sprite level status!'
          }).then(() => {
            targetElement.classList.remove("social-export-mode");
            exportBtn.innerText = "Export PNG Image";
          }).catch(err => {
            fallbackDownload(canvas, fileName);
            targetElement.classList.remove("social-export-mode");
            exportBtn.innerText = "Export PNG Image";
          });
        } else {
          fallbackDownload(canvas, fileName);
          targetElement.classList.remove("social-export-mode");
          exportBtn.innerText = "Export PNG Image";
        }
      }, "image/png");
    }).catch(err => {
      console.error("Image synthesis failed:", err);
      targetElement.classList.remove("social-export-mode");
      exportBtn.innerText = "Error! Try Again";
    });
  }, 120);
}

function fallbackDownload(canvas, fileName) {
  const link = document.createElement("a");
  link.download = fileName;
  link.href = canvas.toDataURL("image/png");
  link.click();
}

function render() {
  const app = document.getElementById("app");

  let rawList = state.sortMode === "fortnite" ? SPRITES_FORTNITE : SPRITES_ORGANIZE;

  let activeList = [];
  rawList.forEach(s => {
    let filteredVariants = s.variants.filter(v => {
      if (!state.showUnreleased && isUnreleased(s.id, v)) return false;
      return true;
    });
    if (filteredVariants.length > 0) {
      activeList.push({ id: s.id, name: s.name, variants: filteredVariants });
    }
  });

  let totalPointsPossible = 0;
  let currentPointsEarned = 0;
  let imageCounter = 383; 

  activeList.forEach(s => {
    s.variants.forEach(v => {
      totalPointsPossible += 5;
      if (!state.inventory[s.id]) state.inventory[s.id] = {};
      let lvl = state.inventory[s.id][v] || 0;
      currentPointsEarned += lvl;
    });
  });
  
  const pct = totalPointsPossible > 0 ? Math.round((currentPointsEarned / totalPointsPossible) * 100) : 0;
  const missingNames = activeList.filter(s => s.variants.some(v => (state.inventory[s.id][v] || 0) < 5)).map(s => s.name);
  const missingLabel = missingNames.length ? `Still leveling: ${missingNames.slice(0, 3).join(", ")}${missingNames.length > 3 ? "..." : ""}` : "All styles fully Maxed! 🎉";

  let cardsHtml = activeList.map(s => {
    const isSingle = s.variants.length === 1;
    const cells = s.variants.map(v => {
      if (!state.inventory[s.id]) state.inventory[s.id] = {};
      let lvl = state.inventory[s.id][v] || 0;
      let btnClass = "";
      let labelText = "✕ NEED";
      if (!isSingle) labelText = v;
      if (lvl > 0) { btnClass = "have " + v; labelText = "LVL " + lvl; if (!isSingle) labelText = v.toUpperCase() + " L" + lvl; }
      if (lvl === 5) { btnClass = "max-lvl " + v; labelText = v.toUpperCase() + " MAX"; if (isSingle) labelText = "MAX"; }

      let imagePath = getImagePath(s.id, v);
      
      if (!imagePath) {
        const currentImgNum = String(imageCounter).padStart(4, '0');
        imagePath = `Images/IMG_${currentImgNum}.webp`;
      }
      
      if (v !== "gem" && v !== "holofoil" && v !== "cube" && v !== "quack" 
          && s.id !== "air" && s.id !== "seven" && s.id !== "batman" 
          && s.id !== "pollo" && s.id !== "vinijr" && s.id !== "johnwick"
          && s.id !== "lootinllama" && s.id !== "peekypeely" && s.id !== "ironmouse") {
        imageCounter++;
      }

      return `<div class="toggle ${btnClass}" data-sprite="${s.id}" data-variant="${v}">
          <img class="variant-icon" src="${imagePath}" onerror="this.style.opacity='0.15';" alt="">
          <div class="toggle-label">${labelText}</div>
        </div>`;
    }).join("");

    const variantsJsonStr = JSON.stringify(s.variants).replace(/"/g, '&quot;');

    return `<div class="sprite-card">
        <div class="sprite-info">
          <div class="sprite-name">${s.name}</div>
          <button class="max-row-btn" onclick='maxEntireRow("${s.id}", ${variantsJsonStr})'>MAX ROW</button>
        </div>
        <div class="variants-row">${cells}</div>
      </div>`;
  }).join("");

  const sheetOptions = Object.keys(appState.profiles).map(id => {
    const prof = appState.profiles[id];
    return `<option value="${id}" ${id === appState.activeId ? "selected" : ""}>📋 ${prof.username || "Unnamed Sheet"}</option>`;
  }).join("");

  const discordUser = JSON.parse(localStorage.getItem("discord_user"));
  let discordUI = discordUser 
    ? `<div class="discord-status">Linked to Discord: <strong>${discordUser.username}</strong></div>`
    : `<a href="https://discord.com/oauth2/authorize?client_id=1533044841611792464&response_type=code&redirect_uri=https%3A%2F%2Fsprites.tyrantnetworks.com%2F&scope=identify" class="discord-login-btn">Link Discord Account</a>`;

  app.innerHTML = `
    <div class="discord-panel">${discordUI}</div>

    <div class="sheet-manager">
      <select class="sheet-selector" onchange="switchSheet(this.value)">${sheetOptions}</select>
      <button class="sheet-btn" onclick="newSheet()">+ New Sheet</button>
      <button class="sheet-btn delete" onclick="deleteSheet()" title="Delete Sheet">✕</button>
    </div>

    <div class="sheet-manager">
      <select class="sort-selector" onchange="updateSortMode(this.value)">
        <option value="organize" ${state.sortMode === 'organize' ? 'selected' : ''}>📂 Organize Order (Default)</option>
        <option value="fortnite" ${state.sortMode === 'fortnite' ? 'selected' : ''}>🎮 Fortnite’s Order</option>
      </select>
    </div>

    <div class="hint">Tap tiles to cycle level. Hold down a tile or tap "MAX ROW" to instantly hit Level 5!</div>

    <div class="export-container" id="capture-area">
      <div class="header">
        <div class="title-block">
          <div class="eyebrow">Fortnite · Sprite Trading</div>
          <h1>SPRITE CHECKLIST</h1>
        </div>
        <div class="epic-tag">
          <div class="label">Epic Username</div>
          <input type="text" class="username-input" value="${state.username}" oninput="updateUsername(this.value)" placeholder="Type Username...">
          <div class="username-static" id="username-mirror">${state.username || "PLAYER"}</div>
        </div>
      </div>
      <div class="sprites-grid">${cardsHtml}</div>
      <div class="legend-bar">
        <div class="link-group">
          <a href="https://buymeacoffee.com/benitopak96" target="_blank" class="tip-link">☕ Support the Dev</a>
          <a href="https://discord.gg/sfat9mcv73" target="_blank" class="tip-link discord-link">💬 Join Discord</a>
        </div>
        <button class="reset-btn" onclick="resetAll()">Reset Sheet</button>
      </div>
      <div class="footer-bar">
        <div>
          <div class="progress-label">${missingLabel}</div>
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        </div>
        <div class="cta">Got what I need? Comment your name & add <span id="cta-username">${state.username || "[Input Username]"}</span></div>
      </div>
      <div class="export-watermark">Track your collection at <span>sprites.tyrantnetworks.com</span></div>
    </div>
    <button class="export-btn" onclick="exportAsImage()">Export PNG Image</button>
  `;

  document.querySelectorAll('.toggle').forEach(element => {
    setupTouchListeners(element, element.getAttribute('data-sprite'), element.getAttribute('data-variant'));
  });
}

// --- INITIALIZATION & OAUTH ENGINE ---
const urlParams = new URLSearchParams(window.location.search);
const authCode = urlParams.get('code');

if (authCode) {
  document.getElementById('app').innerHTML = '<div class="loading">Authenticating with Discord...</div>';
  fetch("https://sapi.tyrantnetworks.com/auth/discord", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ code: authCode })
  })
  .then(response => response.json())
  .then(data => {
    if (data.user_id) {
      localStorage.setItem("discord_user", JSON.stringify(data));
      window.history.replaceState({}, document.title, window.location.pathname);
      loadState();
    }
  })
  .catch(error => {
    console.error("Discord Auth Failed:", error);
    window.history.replaceState({}, document.title, window.location.pathname);
    loadState();
  });
} else {
  loadState();
}
</script>
