<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sprites">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Fortnite Sprite Checklist</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&display=swap');

  :root {
    --bg: #0b0e14;
    --panel: #11151f;
    --gold: #e8b339;
    --gummy: #ff5fa3;
    --galaxy: #7c6cf0;
    --gem: #a3e2f7;
    --holofoil: #e0abf5;
    --cube: #b847ff;
    --quack: #ffb703;
    --cheat: #39e678;
    --loot: #ff9f43;
    --bounty: #ff2f6e;
    --have: #2ee6a6;
    --need: #ff5566;
    --ink: #eef0f6;
    --ink-dim: #8d93a8;
    --line: #1d2331; --inset: #161b27; --line2: #3a4154; --nav-bg: rgba(20,24,34,0.92); --toast-bg: #1b2130;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(124,108,240,0.18), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(232,179,57,0.10), transparent 50%);
    font-family: 'Space Grotesk', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    padding: calc(14px + env(safe-area-inset-top, 0px)) 12px 16px;
  }

  .export-container {
    background: var(--bg);
    padding: 4px;
    border-radius: 12px;
    width: 100%;
  }

  .wrap { max-width: 640px; margin: 0 auto; }

  /* Page Nav (Checklist / Item Shop) */
  .page-nav { display: flex; gap: 8px; margin-bottom: 12px; }
  .page-nav-btn {
    flex: 1; background: var(--panel); border: 1px solid var(--line); color: var(--ink-dim);
    padding: 12px; border-radius: 8px; font-family: 'Bebas Neue', sans-serif; font-size: 16px;
    letter-spacing: 0.5px; cursor: pointer; transition: all 0.15s ease;
  }
  .page-nav-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(232,179,57,0.08); }
  .page-nav-btn:hover { border-color: var(--line2); }

  /* Item Shop */
  .shop-section { margin-bottom: 16px; }
  .shop-section-title {
    font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 0.5px;
    color: var(--galaxy); margin-bottom: 8px; text-transform: uppercase;
  }
  .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
  .shop-card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px;
    display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px;
    cursor: pointer;
  }
  .shop-card-img { width: 90px; height: 90px; object-fit: contain; border-radius: 6px; background: var(--inset); }
  .shop-card-name { font-size: 11px; font-weight: 700; line-height: 1.2; }
  .shop-card-price { font-size: 12px; color: var(--gold); font-weight: 700; }
  .shop-card-countdown { font-size: 10px; color: var(--ink-dim); }

  /* Item Preview Modal */
  .item-preview-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 1000;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .item-preview-card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 20px; max-width: 360px; width: 100%; text-align: center; position: relative;
    max-height: 85vh; overflow-y: auto;
  }
  .item-preview-close {
    position: absolute; top: 10px; right: 10px; background: var(--inset); border: 1px solid var(--line);
    color: var(--ink-dim); width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 14px;
  }
  .item-preview-close:hover { color: var(--need); border-color: var(--need); }
  .item-preview-nav-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .item-preview-nav {
    background: var(--inset); border: 1px solid var(--line); color: var(--ink);
    width: 32px; height: 32px; min-width: 32px; border-radius: 50%; cursor: pointer; font-size: 18px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .item-preview-nav:hover { border-color: var(--gold); color: var(--gold); }
  .item-preview-img { flex: 1; min-width: 0; max-height: 300px; object-fit: contain; border-radius: 10px; background: var(--inset); }
  .item-preview-badges { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-bottom: 8px; }
  .item-preview-badge {
    font-size: 10px; font-weight: 700; letter-spacing: 0.3px; text-transform: uppercase;
    padding: 3px 8px; border-radius: 20px; background: rgba(124,108,240,0.15); color: var(--galaxy);
    border: 1px solid rgba(124,108,240,0.3);
  }
  .item-preview-badge.type { background: rgba(232,179,57,0.12); color: var(--gold); border-color: rgba(232,179,57,0.3); }
  .item-preview-name { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 0.5px; margin-bottom: 6px; }
  .item-preview-desc { font-size: 12px; color: var(--ink-dim); margin-bottom: 10px; }
  .item-preview-price { font-size: 15px; color: var(--gold); font-weight: 700; }
  .item-preview-expiry { font-size: 11px; color: var(--ink-dim); margin-top: 8px; }
  .item-preview-id { font-size: 10px; color: var(--ink-dim); margin-top: 4px; font-family: monospace; word-break: break-all; }
  .item-preview-assets { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
  .item-preview-asset-btn { font-size: 10px; background: var(--inset); border: 1px solid var(--line); color: var(--ink-dim); padding: 4px 10px; border-radius: 20px; cursor: pointer; }
  .item-preview-asset-btn:hover { color: var(--gold); border-color: var(--gold); }
  .item-preview-sublist { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); text-align: left; max-height: 200px; overflow-y: auto; }
  .item-preview-subtitle { font-size: 11px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  .item-preview-subrow { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 12px; cursor: pointer; }
  .item-preview-subrow:hover { color: var(--gold); }
  .item-preview-subrow:last-child { border-bottom: none; }
  .item-preview-subimg { width: 32px; height: 32px; object-fit: contain; background: var(--inset); border-radius: 6px; flex-shrink: 0; }
  
  /* Discord Integration UI */
  .discord-panel {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(124,108,240,0.1);
    border: 1px solid rgba(124,108,240,0.3);
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 12px;
  }
  .discord-status {
    font-size: 13px;
    color: var(--ink);
  }
  .discord-status strong { color: var(--galaxy); }
  .discord-login-btn {
    background: var(--galaxy);
    color: white;
    text-decoration: none;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 4px;
    transition: all 0.2s;
  }
  .discord-login-btn:hover { background: #5b49db; }

  /* Sheet Manager UI */
  .sheet-manager {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    background: var(--panel);
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    align-items: center;
  }
  .sheet-selector, .sort-selector {
    flex-grow: 1;
    background: var(--inset);
    color: var(--gold);
    border: 1px solid var(--line);
    padding: 6px;
    border-radius: 4px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    outline: none;
    cursor: pointer;
  }
  .season-selector {
    flex-grow: 1;
    background: var(--inset);
    color: var(--galaxy);
    border: 1px solid var(--line);
    padding: 8px;
    border-radius: 4px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 15px;
    letter-spacing: 0.5px;
    outline: none;
    cursor: pointer;
  }
  .sheet-btn {
    background: var(--inset);
    color: var(--ink);
    border: 1px solid var(--line);
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12px;
    transition: all 0.2s;
    font-weight: 600;
  }
  .sheet-btn:hover { border-color: var(--galaxy); color: var(--galaxy); }
  .sheet-btn.delete { color: var(--need); border-color: #3a1a1f; background: rgba(255,85,102,0.05); }
  .sheet-btn.delete:hover { border-color: var(--need); background: rgba(255,85,102,0.15); }

  /* Tab row (Sprites / Lobby Hack Codes) for Season 4 */
  .tab-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .tab-btn {
    flex: 1; background: var(--panel); border: 1px solid var(--line); color: var(--ink-dim);
    padding: 10px; border-radius: 8px; font-family: 'Bebas Neue', sans-serif; font-size: 15px;
    letter-spacing: 0.5px; cursor: pointer; transition: all 0.15s ease;
  }
  .tab-btn.active { border-color: var(--galaxy); color: var(--galaxy); background: rgba(124,108,240,0.08); }
  .tab-btn:hover { border-color: var(--line2); }

  /* Unreleased Toggle Switch Bar */
  .toggle-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--panel);
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--line);
    margin-bottom: 12px;
    font-size: 13px;
    font-weight: 600;
  }
  .switch {
    position: relative;
    display: inline-block;
    width: 42px;
    height: 22px;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
    background-color: var(--inset); border: 1px solid var(--line); transition: .2s; border-radius: 22px;
  }
  .slider:before {
    position: absolute; content: ""; height: 16px; width: 16px; left: 2px; bottom: 2px;
    background-color: var(--ink-dim); transition: .2s; border-radius: 50%;
  }
  input:checked + .slider { background-color: var(--galaxy); border-color: var(--galaxy); }
  input:checked + .slider:before { transform: translateX(20px); background-color: white; }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--line);
    padding-bottom: 10px;
    margin-bottom: 8px;
    gap: 10px;
  }

  .title-block .eyebrow {
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--galaxy);
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 2px;
  }

  .title-block h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 1px;
    line-height: 1;
  }

  .epic-tag { text-align: right; min-width: 140px; }

  .epic-tag .label {
    font-size: 10px;
    color: var(--ink-dim);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 2px;
  }

  .username-input {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    color: var(--gold);
    letter-spacing: 1px;
    background: var(--inset);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 2px 6px;
    text-align: right;
    width: 100%;
    outline: none;
    transition: border-color 0.2s;
  }
  
  .username-input:focus { border-color: var(--gold); }

  .username-static {
    display: none;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    color: var(--gold);
    letter-spacing: 1px;
    text-align: right;
    padding-right: 2px;
  }

  .hint {
    font-size: 12px;
    color: var(--ink-dim);
    line-height: 1.3;
    text-align: center;
    margin-bottom: 12px;
  }

  .export-btn {
    font-family: 'Bebas Neue', sans-serif;
    background: linear-gradient(135deg, var(--galaxy), #5b49db);
    color: white;
    border: none;
    font-size: 18px;
    padding: 14px;
    border-radius: 12px;
    cursor: pointer;
    letter-spacing: 0.5px;
    box-shadow: 0 4px 12px rgba(124,108,240,0.3);
    white-space: nowrap;
    transition: transform 0.1s ease;
    width: 100%;
    margin-top: 12px;
  }

  /* Social Export Mode Constraints */
  .social-export-mode {
    width: 580px !important; 
    padding: 12px !important;
  }

  .social-export-mode .username-input { display: none !important; }
  .social-export-mode .username-static { display: block !important; }
  .social-export-mode .max-row-btn { display: none !important; }
  .social-export-mode .sheet-manager { display: none !important; }
  .social-export-mode .discord-panel { display: none !important; }
  .social-export-mode .toggle-bar { display: none !important; }
  .social-export-mode .tab-row { display: none !important; }

  .social-export-mode .header {
    padding-left: 4px !important;
    padding-right: 8px !important;
    margin-bottom: 12px !important;
  }

  .social-export-mode .sprites-grid {
    display: grid !important;
    grid-template-columns: repeat(3, 1fr) !important;
    gap: 6px !important;
  }

  .social-export-mode .sprite-card {
    padding: 6px 4px !important;
    gap: 5px !important;
    border-radius: 8px !important;
  }

  .social-export-mode .sprite-name { font-size: 11px !important; letter-spacing: 0px !important; }
  .social-export-mode .variants-row { gap: 3px !important; }
  .social-export-mode .variant-icon { width: 22px !important; height: 22px !important; }

  .social-export-mode .toggle {
    padding: 3px 1px !important;
    border-radius: 4px !important;
    min-width: 0 !important;
    width: calc(25% - 3px) !important;
  }

  .social-export-mode .sprite-card:has(.toggle:nth-child(5)) .toggle {
    width: calc(20% - 3px) !important;
  }
  .social-export-mode .sprite-card:has(.toggle:nth-child(6)) .toggle {
    width: calc(16.66% - 3px) !important;
  }
  .social-export-mode .sprite-card:has(.toggle:nth-child(7)) .toggle {
    width: calc(14.28% - 3px) !important;
  }

  .social-export-mode .toggle-label {
    font-size: 5px !important;
    letter-spacing: -0.2px !important;
    transform: scale(0.95);
  }

  .social-export-mode .legend-bar { display: none !important; }
  .social-export-mode .footer-bar { margin-top: 12px !important; padding: 10px !important; }

  .export-watermark { display: none; }
  .social-export-mode .export-watermark {
    display: block !important;
    text-align: center;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink-dim);
    margin-top: 14px;
    padding-top: 12px;
    border-top: 2px dashed var(--line);
    letter-spacing: 0.5px;
  }
  .social-export-mode .export-watermark span {
    color: var(--gold);
    margin-left: 4px;
  }

  .sprites-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
  .sprite-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .sprite-info { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .sprite-name { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 0.5px; line-height: 1; text-transform: uppercase; }
  .sprite-name-wrap { display: flex; flex-direction: column; gap: 2px; }
  .sprite-rarity { font-size: 9px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; }
  .rarity-mythic { color: #ff8a3d; }
  .rarity-legendary { color: var(--gold); }
  .rarity-epic { color: var(--galaxy); }
  .rarity-rare { color: var(--gem); }

  .max-row-btn {
    font-family: 'Bebas Neue', sans-serif; font-size: 12px; color: var(--ink-dim); background: var(--inset);
    border: 1px solid var(--line); padding: 2px 6px; border-radius: 4px; cursor: pointer; letter-spacing: 0.5px; transition: all 0.1s ease;
  }
  .max-row-btn:hover { color: var(--gold); border-color: var(--gold); }

  .variants-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .variants-row .toggle { width: calc(25% - 5px); min-width: 68px; }
  .variants-row.single-variant .toggle { width: 100%; }

  .toggle {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    padding: 8px 4px; border-radius: 8px; border: 2px solid var(--line); background: var(--inset);
    cursor: pointer; transition: all 0.15s ease; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  .toggle:hover { border-color: var(--line2); }

  .toggle.have.normal { border-color: rgba(184,191,209,0.3); background: rgba(184,191,209,0.04); }
  .toggle.have.gold { border-color: rgba(232,179,57,0.3); background: rgba(232,179,57,0.04); }
  .toggle.have.gummy { border-color: rgba(255,95,163,0.3); background: rgba(255,95,163,0.04); }
  .toggle.have.galaxy { border-color: rgba(124,108,240,0.3); background: rgba(124,108,240,0.04); }
  .toggle.have.gem { border-color: rgba(163,226,247,0.3); background: rgba(163,226,247,0.04); }
  .toggle.have.holofoil { border-color: rgba(224,171,245,0.3); background: rgba(224,171,245,0.04); }
  .toggle.have.cube { border-color: rgba(184,71,255,0.3); background: rgba(184,71,255,0.04); }
  .toggle.have.quack { border-color: rgba(255,183,3,0.3); background: rgba(255,183,3,0.04); }
  .toggle.have.ironmouse { border-color: rgba(224,171,245,0.3); background: rgba(224,171,245,0.04); }
  .toggle.have.johnwick { border-color: rgba(224,171,245,0.3); background: rgba(224,171,245,0.04); }
  .toggle.have.peanut { border-color: rgba(224,171,245,0.3); background: rgba(224,171,245,0.04); }
  .toggle.have.vinijr { border-color: rgba(224,171,245,0.3); background: rgba(224,171,245,0.04); }
  .toggle.have.pollo { border-color: rgba(224,171,245,0.3); background: rgba(224,171,245,0.04); }
  .toggle.have.cheatmaster { border-color: rgba(57,230,120,0.3); background: rgba(57,230,120,0.04); }
  .toggle.have.loothacker { border-color: rgba(255,159,67,0.3); background: rgba(255,159,67,0.04); }
  .toggle.have.bountyhacker { border-color: rgba(255,47,110,0.3); background: rgba(255,47,110,0.04); }
  .toggle.have.bountyhunter { border-color: rgba(255,47,110,0.3); background: rgba(255,47,110,0.04); }
  .toggle.have.trickortreat { border-color: rgba(255,140,0,0.3); background: rgba(255,140,0,0.04); }

  .toggle.max-lvl { border-width: 2px; }
  .toggle.max-lvl.normal { border-color: rgba(184,191,209,0.9); background: rgba(184,191,209,0.12); }
  .toggle.max-lvl.gold { border-color: rgba(232,179,57,0.9); background: rgba(232,179,57,0.12); }
  .toggle.max-lvl.gummy { border-color: rgba(255,95,163,0.9); background: rgba(255,95,163,0.12); }
  .toggle.max-lvl.galaxy { border-color: rgba(124,108,240,0.9); background: rgba(124,108,240,0.14); }
  .toggle.max-lvl.gem { border-color: rgba(163,226,247,0.9); background: rgba(163,226,247,0.15); }
  .toggle.max-lvl.holofoil { border-color: rgba(224,171,245,0.9); background: rgba(224,171,245,0.15); }
  .toggle.max-lvl.cube { border-color: rgba(184,71,255,0.9); background: rgba(184,71,255,0.14); }
  .toggle.max-lvl.quack { border-color: rgba(255,183,3,0.9); background: rgba(255,183,3,0.14); }
  .toggle.max-lvl.ironmouse { border-color: rgba(224,171,245,0.9); background: rgba(224,171,245,0.15); }
  .toggle.max-lvl.johnwick { border-color: rgba(224,171,245,0.9); background: rgba(224,171,245,0.15); }
  .toggle.max-lvl.peanut { border-color: rgba(224,171,245,0.9); background: rgba(224,171,245,0.15); }
  .toggle.max-lvl.vinijr { border-color: rgba(224,171,245,0.9); background: rgba(224,171,245,0.15); }
  .toggle.max-lvl.pollo { border-color: rgba(224,171,245,0.9); background: rgba(224,171,245,0.15); }
  .toggle.max-lvl.cheatmaster { border-color: rgba(57,230,120,0.9); background: rgba(57,230,120,0.14); }
  .toggle.max-lvl.loothacker { border-color: rgba(255,159,67,0.9); background: rgba(255,159,67,0.14); }
  .toggle.max-lvl.bountyhacker { border-color: rgba(255,47,110,0.9); background: rgba(255,47,110,0.14); }
  .toggle.max-lvl.bountyhunter { border-color: rgba(255,47,110,0.9); background: rgba(255,47,110,0.14); }

// --- API SYNC ENGINE (login token required; the server only lets you change YOUR checklist) ---
const API_BASE = "https://sapi.tyrantnetworks.com";
const DISCORD_OAUTH_URL = "https://discord.com/oauth2/authorize?client_id=1533044841611792464&response_type=code&redirect_uri=https%3A%2F%2Fsprites.tyrantnetworks.com%2F&scope=identify";
const DIRTY_KEY = "sprite-sync-dirty-v1";
let syncTimer = null;
let authProblem = false;

function getDiscordUser() { try { return JSON.parse(localStorage.getItem("discord_user")); } catch (e) { return null; } }
function authHeaders() { const u = getDiscordUser(); return (u && u.token) ? { "Authorization": "Bearer " + u.token } : {}; }
function setDirty(on) { try { if (on) localStorage.setItem(DIRTY_KEY, "1"); else localStorage.removeItem(DIRTY_KEY); } catch (e) {} }
function isDirty() { try { return localStorage.getItem(DIRTY_KEY) === "1"; } catch (e) { return false; } }

function discordPanelInner() {
  const u = getDiscordUser();
  if (!u) return `<a href="${DISCORD_OAUTH_URL}" class="discord-login-btn">Link Discord Account</a>`;
  if (!u.token || authProblem) return `<div class="discord-status">🔐 Re-link Discord to keep syncing</div><a href="${DISCORD_OAUTH_URL}" class="discord-login-btn">Re-link</a>`;
  return `<div class="discord-status">Linked to Discord: <strong>${esc(u.username)}</strong></div>`;
}
function markAuthProblem(on) {
  if (authProblem === on) return;
  authProblem = on;
  const el = document.getElementById("discordPanel");
  if (el) { el.innerHTML = discordPanelInner(); el.classList.toggle("warn", on || !(getDiscordUser() || {}).token); }
}

function syncToVPS() {
  const user = getDiscordUser();
  if (!user) return;
  setDirty(true); // stays set until the server confirms, so unsynced edits are never overwritten by an older server copy
  if (!user.token) { markAuthProblem(true); return; }
  clearTimeout(syncTimer);
  syncTimer = setTimeout(pushToServer, 700);
}
function pushToServer() {
  syncTimer = null;
  const user = getDiscordUser();
  if (!user || !user.token) return;
  fetch(API_BASE + "/api/sprites/save", {
    method: "POST",
    headers: Object.assign({ "Content-Type": "application/json" }, authHeaders()),
    body: JSON.stringify({ collection_data: [appState] }),
    keepalive: true
  }).then(res => {
    if (res.ok) { setDirty(false); markAuthProblem(false); }
    else if (res.status === 401) markAuthProblem(true);
    else console.error("Database sync rejected:", res.status);
  }).catch(e => console.error("Database sync failed:", e));
}
function flushSync() { if (syncTimer) { clearTimeout(syncTimer); pushToServer(); } }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushSync(); });
window.addEventListener("pagehide", flushSync);

function normalizeProfiles(app) {
  Object.keys(app.profiles).forEach(profId => {
    let prof = app.profiles[profId];
    if (!prof.sortMode) prof.sortMode = "organize";
    if (!prof.sortModeS4) prof.sortModeS4 = "fortnite";
    if (prof.showUnreleased === undefined) prof.showUnreleased = true;
    if (!prof.season) prof.season = "s3";
    if (!prof.view) prof.view = "sprites";
    if (!prof.inventory) prof.inventory = {};
    if (!prof.inventoryS4) prof.inventoryS4 = {};
    if (!prof.codes) prof.codes = {};

    // Archived: Punk's Gem was planned for Season 3 but never released. Your level is kept here
    // (not counted) so Season 3 can reach 100% without it.
    if (prof.inventory.punk && prof.inventory.punk.gem !== undefined) {
      prof.archived = prof.archived || {};
      prof.archived["s3:punk:gem"] = prof.inventory.punk.gem;
      delete prof.inventory.punk.gem;
    }

    Object.keys(ALL_VARIANTS_MAP).forEach(id => {
      if (!prof.inventory[id]) prof.inventory[id] = {};
      ALL_VARIANTS_MAP[id].forEach(v => { if (prof.inventory[id][v] === undefined) prof.inventory[id][v] = 0; });
    });

    // One-time migration: Crown's "Bounty Hacker" variant is renamed to "Bounty Hunter" to match every other sprite.
    if (prof.inventoryS4.crown4 && prof.inventoryS4.crown4.bountyhacker !== undefined) {
      if (!prof.inventoryS4.crown4.bountyhunter) {
        prof.inventoryS4.crown4.bountyhunter = prof.inventoryS4.crown4.bountyhacker;
      }
      delete prof.inventoryS4.crown4.bountyhacker;
    }

    SEASON4_SPRITES.forEach(s => {
      if (!prof.inventoryS4[s.id]) prof.inventoryS4[s.id] = {};
      s.variants.forEach(v => { if (prof.inventoryS4[s.id][v] === undefined) prof.inventoryS4[s.id][v] = 0; });
    });

    LOBBY_CODES.forEach(c => { if (prof.codes[c.code] === undefined) prof.codes[c.code] = false; });
  });
  if (!app.profiles[app.activeId]) {
    app.activeId = Object.keys(app.profiles)[0];
  }
}

function loadState() {
  const savedMulti = localStorage.getItem(MULTI_STORAGE_KEY);
  if (savedMulti) {
    appState = JSON.parse(savedMulti);
  } else {
    const legacySaved = localStorage.getItem(LEGACY_KEY);
    if (legacySaved) appState.profiles["default"].inventory = JSON.parse(legacySaved);
  }

  normalizeProfiles(appState);
  state = appState.profiles[appState.activeId];
  render();

  const user = getDiscordUser();
  if (user && !user.token) { markAuthProblem(true); }
  else if (user) {
    fetch(`${API_BASE}/api/sprites/${user.user_id}`, { headers: authHeaders() })
      .then(res => {
        if (res.status === 401 || res.status === 403) { markAuthProblem(true); throw new Error("auth"); }
        return res.json();
      })
      .then(data => {
        markAuthProblem(false);
        // Edits made while sync was unavailable win over the older server copy, and get pushed up.
        if (isDirty()) { syncToVPS(); return; }
        if (data.collection_data && data.collection_data.length > 0) {
          appState = data.collection_data[0];
          const beforeNormalize = JSON.stringify(appState);
          normalizeProfiles(appState);
          state = appState.profiles[appState.activeId];
          localStorage.setItem(MULTI_STORAGE_KEY, JSON.stringify(appState));
          render();
          // If new sprites/variants were added by an update, push the filled-in
          // inventory back so the Discord bot sees them right away (no tap needed).
          if (JSON.stringify(appState) !== beforeNormalize) syncToVPS();
        }
      }).catch(e => { if (e.message !== "auth") console.error("VPS Load error:", e); });
  }
}

function saveState() {
  try {
    appState.profiles[appState.activeId] = state;
    localStorage.setItem(MULTI_STORAGE_KEY, JSON.stringify(appState));
    syncToVPS();
  } catch (e) { console.error("Failed to save state:", e); }
}

async function loadShop() {
  shopLoading = true;
  render();
  try {
    const res = await fetch("https://fortnite-api.com/v2/shop");
    if (!res.ok) throw new Error("Shop request failed: " + res.status);
    const json = await res.json();
    shopData = json.data;
    shopLoadedAt = new Date();
  } catch (e) {
    console.error("Shop load error:", e);
    shopData = null;
  }
  shopLoading = false;
  render();
}

function formatCountdown(outDate) {
  if (!outDate) return "";
  const end = new Date(outDate).getTime();
  const diff = end - Date.now();
  if (isNaN(end) || diff <= 0) return "";
  const days = Math.floor(diff / 86400000);
  const hours = Math.floor((diff % 86400000) / 3600000);
  if (days > 0) return `${days}D ${hours}H`;
  const mins = Math.floor((diff % 3600000) / 60000);
  return `${hours}H ${mins}M`;
}

function getEntryDisplay(entry) {
  const isBundle = !!entry.bundle;
  let name = "Unknown Item";
  let thumbImage = null;
  let previewImage = null;
  let description = "";
  let items = [];
  let typeLabel = "";
  let seriesLabel = "";
  let itemId = entry.offerId || "";
  let assetVariants = [];

  if (entry.brItems && entry.brItems.length) {
    items = entry.brItems.map(i => ({
      name: i.name || "Item",
      image: (i.images && (i.images.featured || i.images.icon || i.images.smallIcon)) || null,
      description: i.description || ""
    }));
    const first = entry.brItems[0];
    typeLabel = (first.type && first.type.displayValue) || "";
    seriesLabel = (first.series && first.series.value) || "";
    if (!isBundle && first.id) itemId = first.id;
    if (first.images) {
      if (first.images.icon) assetVariants.push({ label: "Icon", url: first.images.icon });
      if (first.images.featured) assetVariants.push({ label: "Featured", url: first.images.featured });
      if (first.images.smallIcon && first.images.smallIcon !== first.images.icon) assetVariants.push({ label: "Small", url: first.images.smallIcon });
    }
  } else if (entry.tracks && entry.tracks.length) {
    items = entry.tracks.map(t => ({
      name: t.title || t.name || "Track",
      image: t.albumArt || null,
      description: t.artist ? `by ${t.artist}${t.album ? " — " + t.album : ""}` : ""
    }));
    typeLabel = "Jam Track";
  } else if (entry.instruments && entry.instruments.length) {
    items = entry.instruments.map(it => ({
      name: it.name || "Instrument",
      image: (it.images && (it.images.large || it.images.small)) || it.image || null,
      description: it.description || ""
    }));
    typeLabel = "Instrument";
  } else if (entry.cars && entry.cars.length) {
    items = entry.cars.map(c => ({
      name: c.name || "Car",
      image: (c.images && (c.images.large || c.images.small)) || c.image || null,
      description: c.description || ""
    }));
    typeLabel = "Car Body";
  } else if (entry.legoKits && entry.legoKits.length) {
    items = entry.legoKits.map(lk => ({
      name: lk.name || "LEGO Kit",
      image: (lk.images && (lk.images.large || lk.images.small)) || lk.image || null,
      description: lk.description || ""
    }));
    typeLabel = "LEGO Kit";
  }

  if (isBundle) {
    name = entry.bundle.name || name;
    thumbImage = entry.bundle.image || (items[0] && items[0].image) || null;
    previewImage = thumbImage;
    description = entry.bundle.info || "";
    typeLabel = "Bundle";
    if (entry.bundle.image) assetVariants = [{ label: "Bundle Art", url: entry.bundle.image }];
  } else if (items.length) {
    name = items.map(i => i.name).join(" + ");
    thumbImage = items[0].image;
    previewImage = items[0].image;
    description = items[0].description;
  }

  if (!thumbImage && entry.newDisplayAsset && entry.newDisplayAsset.renderImages && entry.newDisplayAsset.renderImages.length) {
    thumbImage = entry.newDisplayAsset.renderImages[0].image;
    previewImage = previewImage || thumbImage;
  }

  let expiryLabel = "";
  if (entry.outDate) {
    const d = new Date(entry.outDate);
    if (!isNaN(d.getTime())) {
      expiryLabel = `Leaving Shop on ${d.toLocaleDateString([], {month:'numeric', day:'numeric'})}, ${d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})}`;
    }
  }

  return { name, thumbImage, previewImage, description, price: entry.finalPrice, items, isBundle, typeLabel, seriesLabel, expiryLabel, countdown: formatCountdown(entry.outDate), itemId, assetVariants };
}

function renderShop() {
  if (shopLoading) {
    return `<div class="loading">Loading today's Item Shop…</div>`;
  }
  if (!shopData || !Array.isArray(shopData.entries)) {
    return `<div class="loading">Couldn't load the Item Shop right now.
      <br><button class="reset-btn" style="margin-top:10px;" onclick="loadShop()">Try Again</button></div>`;
  }

  shopCardData = [];

  const sections = {};
  shopData.entries.forEach(entry => {
    const sectionName = (entry.layout && entry.layout.name) ? entry.layout.name : "Item Shop";
    if (!sections[sectionName]) sections[sectionName] = [];
    sections[sectionName].push(entry);
  });

  const updatedLabel = shopLoadedAt
    ? `Last updated ${shopLoadedAt.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`
    : "";

  const sectionsHtml = Object.keys(sections).map(sectionName => {
    const items = sections[sectionName].map(entry => {
      const display = getEntryDisplay(entry);
      shopCardData.push(display);
      const idx = shopCardData.length - 1;

      return `<div class="shop-card" onclick="openItemPreview(${idx})">
          <img class="shop-card-img" src="${display.thumbImage || ''}" onerror="this.style.opacity='0.15';" alt="">
          <div class="shop-card-name">${display.name}</div>
          <div class="shop-card-price">🪙 ${display.price}</div>
          ${display.countdown ? `<div class="shop-card-countdown">🕐 ${display.countdown}</div>` : ""}
        </div>`;
    }).join("");

    return `<div class="shop-section">
        <div class="shop-section-title">${sectionName}</div>
        <div class="shop-grid">${items}</div>
      </div>`;
  }).join("");

  return `<div class="hint">${updatedLabel} — 
      <a href="#" onclick="loadShop(); return false;" style="color:var(--gold);">Refresh</a>
    </div>
    ${sectionsHtml}`;
}

function openItemPreview(idx) {
  if (idx < 0 || idx >= shopCardData.length) return;
  currentPreviewIdx = idx;
  const item = shopCardData[idx];
  if (!item) return;

  const subItemsHtml = (item.items && item.items.length > 1)
    ? `<div class="item-preview-sublist">
        <div class="item-preview-subtitle">Tap an item to view it:</div>
        ${item.items.map(sub => `
          <div class="item-preview-subrow" onclick="swapPreviewImage('${(sub.image || '').replace(/'/g, "&apos;")}')">
            <img class="item-preview-subimg" src="${sub.image || ''}" onerror="this.style.opacity='0.15';" alt="">
            <span>${sub.name}</span>
          </div>
        `).join("")}
      </div>`
    : "";

  const badgesHtml = `<div class="item-preview-badges">
      ${item.seriesLabel ? `<div class="item-preview-badge">${item.seriesLabel}</div>` : ""}
      ${item.typeLabel ? `<div class="item-preview-badge type">${item.typeLabel}</div>` : ""}
    </div>`;

  let overlay = document.getElementById("item-preview-overlay");
  if (!overlay) {
    overlay = document.createElement("div");
    overlay.id = "item-preview-overlay";
    overlay.className = "item-preview-overlay";
    overlay.onclick = (e) => { if (e.target === overlay) closeItemPreview(); };
    document.body.appendChild(overlay);
  }

  overlay.innerHTML = `
    <div class="item-preview-card">
      <button class="item-preview-close" onclick="closeItemPreview()">✕</button>
      <div class="item-preview-nav-row">
        <button class="item-preview-nav" onclick="navigateItemPreview(-1)">‹</button>
        <img id="item-preview-img" class="item-preview-img" src="${item.previewImage || item.thumbImage || ''}" onerror="this.style.opacity='0.15';" alt="">
        <button class="item-preview-nav" onclick="navigateItemPreview(1)">›</button>
      </div>
      ${badgesHtml}
      <div class="item-preview-name">${item.name}</div>
      ${item.description ? `<div class="item-preview-desc">${item.description}</div>` : ""}
      <div class="item-preview-price">🪙 ${item.price}</div>
      ${item.expiryLabel ? `<div class="item-preview-expiry">🕐 ${item.expiryLabel}</div>` : ""}
      ${item.itemId ? `<div class="item-preview-id">ID: ${item.itemId}</div>` : ""}
      ${item.assetVariants.length > 1 ? `<div class="item-preview-assets">${item.assetVariants.map(v => `<button class="item-preview-asset-btn" onclick="swapPreviewImage('${v.url.replace(/'/g, "&apos;")}')">${v.label}</button>`).join("")}</div>` : ""}
      ${subItemsHtml}
    </div>
  `;
}

function navigateItemPreview(delta) {
  if (currentPreviewIdx === null) return;
  let next = currentPreviewIdx + delta;
  if (next < 0) next = shopCardData.length - 1;
  if (next >= shopCardData.length) next = 0;
  openItemPreview(next);
}

function closeItemPreview() {
  const existing = document.getElementById("item-preview-overlay");
  if (existing) existing.remove();
  currentPreviewIdx = null;
}

function swapPreviewImage(url) {
  const img = document.getElementById("item-preview-img");
  if (img) { img.src = url; img.style.opacity = '1'; }
}

function handleTileTap(spriteId, variant) {
  if (isLongPress) return;
  const inv = getActiveInventory();
  let currentLevel = inv[spriteId][variant] || 0;
  let nextLevel = currentLevel + 1;
  if (nextLevel > 5) nextLevel = 0;
  pushUndo(`${spriteName(spriteId)} · ${variantLabel(variant)}: ${currentLevel} → ${nextLevel}`, nextLevel === 0);
  inv[spriteId][variant] = nextLevel;
  saveState();
  render();
}

function handleLongPress(spriteId, variant) {

// --- SCROLL SAFETY: ignore taps that are really part of a scroll ---
let lastScrollAt = 0;
window.addEventListener('scroll', () => { lastScrollAt = Date.now(); }, { passive: true });

// Android (and some iOS) browsers fire emulated mouse events right after a touch. Since the
// page re-renders on every tap, those emulated events landed on the NEW tile and levelled it twice.
let lastTouchAt = 0;
function isEmulatedMouse(e) { return e.type.indexOf('mouse') === 0 && (Date.now() - lastTouchAt) < 900; }

function setupTouchListeners(element, spriteId, variant) {
  let startX = 0, startY = 0, moved = false, blocked = false;

  const startHandler = (e) => {
    if (e.type === 'touchstart') lastTouchAt = Date.now();
    if (isEmulatedMouse(e)) { blocked = true; return; }
    const pt = (e.touches && e.touches[0]) || e;
    startX = pt.clientX; startY = pt.clientY;
    moved = false;
    // A touch that lands while the page is still scrolling (momentum) is just
    // the user stopping the scroll — never a level change.
    blocked = (Date.now() - lastScrollAt) < 300;
    isLongPress = false;
    if (blocked) return;
    touchTimer = setTimeout(() => {
      isLongPress = true;
      handleLongPress(spriteId, variant);
    }, 400);
  };
  const moveHandler = (e) => {
    const pt = (e.touches && e.touches[0]) || e;
    if (Math.abs(pt.clientX - startX) > 8 || Math.abs(pt.clientY - startY) > 8) {
      moved = true;
      if (touchTimer) clearTimeout(touchTimer);
    }
  };
  const endHandler = (e) => {
    if (e.type === 'touchend') { lastTouchAt = Date.now(); if (e.cancelable) e.preventDefault(); }
    if (isEmulatedMouse(e)) return;
    if (touchTimer) clearTimeout(touchTimer);
    if (blocked || moved) return;
    if (Date.now() - lastScrollAt < 120) return;
    if (!isLongPress) handleTileTap(spriteId, variant);
  };
  const cancelHandler = () => { if (touchTimer) clearTimeout(touchTimer); moved = true; };

  element.addEventListener('touchstart', startHandler, { passive: true });
  element.addEventListener('touchend', endHandler);
  element.addEventListener('touchmove', moveHandler, { passive: true });
  element.addEventListener('touchcancel', cancelHandler, { passive: true });
  element.addEventListener('mousedown', startHandler);
  element.addEventListener('mouseup', endHandler);
  element.addEventListener('mouseleave', cancelHandler);
}

// --- SECTION JUMP BUTTONS (▲ / ▼) ---
function jumpSection(dir) {
  const cards = Array.from(document.querySelectorAll('#app .sprite-card:not([hidden])'));
  if (!cards.length) return;
  const GAP = 12;
  let target = null;
  if (dir > 0) {
    target = cards.find(c => c.getBoundingClientRect().top > GAP + 8);
  } else {
    for (let i = cards.length - 1; i >= 0; i--) {
      if (cards[i].getBoundingClientRect().top < -(GAP) ) { target = cards[i]; break; }
    }
  }
  if (target) {
    window.scrollTo({ top: target.getBoundingClientRect().top + window.scrollY - GAP, behavior: 'smooth' });
  } else {
    window.scrollTo({ top: dir > 0 ? document.documentElement.scrollHeight : 0, behavior: 'smooth' });
  }
}

function exportAsImage() {
  const targetElement = document.getElementById("capture-area");
  const exportBtn = document.querySelector(".export-btn");
  exportBtn.innerText = "Generating Share Screen...";
  targetElement.classList.add("social-export-mode");
  document.documentElement.setAttribute("data-theme", "dark");
  
  setTimeout(() => {
    html2canvas(targetElement, {
      useCORS: true, allowTaint: true, scale: 2, backgroundColor: "#0b0e14", width: 580, logging: false
    }).then(canvas => {
      const nameString = state.username ? state.username.replace(/\s+/g, '_') : 'My';
      const seasonTag = state.season === "s4" ? "S4" : "S3";
      const fileName = `${nameString}_Fortnite_${seasonTag}_Checklist.png`;
      canvas.toBlob(blob => {
        const imageFile = new File([blob], fileName, { type: "image/png" });
        if (isMobileDevice() && navigator.canShare && navigator.canShare({ files: [imageFile] })) {
          navigator.share({
            files: [imageFile], title: 'My Sprite Collection Checklist', text: 'Check out my current Fortnite Sprite level status!'
          }).then(() => {
            targetElement.classList.remove("social-export-mode"); applyTheme();
            exportBtn.innerText = "Export PNG Image";
          }).catch(err => {
            fallbackDownload(canvas, fileName);
            targetElement.classList.remove("social-export-mode"); applyTheme();
            exportBtn.innerText = "Export PNG Image";
          });
        } else {
          fallbackDownload(canvas, fileName);
          targetElement.classList.remove("social-export-mode"); applyTheme();
          exportBtn.innerText = "Export PNG Image";
        }
      }, "image/png");
    }).catch(err => {
      console.error("Image synthesis failed:", err);
      targetElement.classList.remove("social-export-mode"); applyTheme();
      exportBtn.innerText = "Error! Try Again";
    });
  }, 120);
}

function fallbackDownload(canvas, fileName) {
  const link = document.createElement("a");
  link.download = fileName;
  link.href = canvas.toDataURL("image/png");
  link.click();
}

function isMobileDevice() {
  return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
}

const PREFS_KEY = "sprite-prefs-v1";
const NEWS_SEEN_KEY = "sprite-news-seen-v1";
let prefs = { theme: "dark", density: "comfortable", hideMaxRow: false };
try { Object.assign(prefs, JSON.parse(localStorage.getItem(PREFS_KEY) || "{}")); } catch (e) {}
function savePrefs() { try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch (e) {} }
function resolvedTheme() {
  if (prefs.theme === "auto") return (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
  return prefs.theme === "light" ? "light" : "dark";
}
function applyTheme() {
  const t = resolvedTheme();
  document.documentElement.setAttribute("data-theme", t);
  document.body.setAttribute("data-density", prefs.density);
  document.body.classList.toggle("hide-max-row", !!prefs.hideMaxRow);
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute("content", t === "light" ? "#f2f4f9" : "#0b0e14");
}
if (window.matchMedia) {
  try { matchMedia("(prefers-color-scheme: light)").addEventListener("change", () => { if (prefs.theme === "auto") applyTheme(); }); } catch (e) {}
}
applyTheme();

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
const VARIANT_NAMES = { trickortreat: "Trick or Treat", bountyhunter: "Bounty Hunter", bountyhacker: "Bounty Hacker", loothacker: "Loot Hacker", cheatmaster: "Cheat Master", johnwick: "John Wick", vinijr: "Vini Jr", ironmouse: "Ironmouse" };
function variantLabel(v) { return VARIANT_NAMES[v] || (v.charAt(0).toUpperCase() + v.slice(1)); }
function spriteName(id) {
  const all = SEASON4_SPRITES.concat(SPRITES_ORGANIZE);
  const f = all.find(s => s.id === id);
  return f ? f.name : id;
}

let s3ImgCache = {};
function iconPath(id, v, season) {
  if ((season || state.season) === "s4") { try { return getImagePathS4(id, v); } catch (e) { return ""; } }
  return s3ImgCache[id + "|" + v] || "";
}

// ---------- stats ----------
function seasonStats(season) {
  const isS4 = season === "s4";
  const list = isS4 ? SEASON4_SPRITES : SPRITES_ORGANIZE;
  const inv = (isS4 ? state.inventoryS4 : state.inventory) || {};
  const out = { pts: 0, max: 0, maxedVariants: 0, totalVariants: 0, spritesDone: 0, totalSprites: 0, rows: [], byRarity: {} };
  list.forEach(s => {
    let sp = 0, sm = 0, sMaxed = 0, n = 0;
    s.variants.forEach(v => {
      if (!isS4 && !state.showUnreleased && isUnreleased(s.id, v)) return;
      const l = (inv[s.id] && inv[s.id][v]) || 0;
      sp += l; sm += 5; n++; out.totalVariants++;
      if (l >= 5) { out.maxedVariants++; sMaxed++; }
    });
    if (!n) return;
    out.pts += sp; out.max += sm; out.totalSprites++;
    if (sMaxed === n) out.spritesDone++;
    out.rows.push({ id: s.id, name: s.name, rarity: s.rarity, variants: s.variants, pts: sp, max: sm, left: sm - sp });
    if (s.rarity) {
      const r = out.byRarity[s.rarity] || (out.byRarity[s.rarity] = { pts: 0, max: 0 });
      r.pts += sp; r.max += sm;
    }
  });
  out.pct = out.max ? Math.round(out.pts / out.max * 100) : 0;
  return out;
}
function pctOf(a, b) { return b ? Math.round(a / b * 100) : 0; }
function bar(p) { return `<div class="bar"><i style="width:${Math.max(0, Math.min(100, p))}%"></i></div>`; }

  return `<details class="dash" ${dashOpen ? "open" : ""} ontoggle="dashOpen=this.open">

let filters = { q: "", status: "all", variant: "" };
let filterSnap = { sig: "", ids: null };
function renderFilterBar(variantList) {
  const opts = variantList.map(v => `<option value="${esc(v)}" ${filters.variant === v ? "selected" : ""}>${esc(variantLabel(v))}</option>`).join("");
  const chip = (k, label) => `<button type="button" class="chip ${filters.status === k ? "active" : ""}" data-status="${k}" onclick="setFilter('status','${k}')">${label}</button>`;
  return `<div class="filter-bar" id="filterBar">
    <input type="search" id="searchBox" placeholder="🔍 Search sprites or styles…" value="${esc(filters.q)}" oninput="setFilter('q',this.value)" autocomplete="off" autocapitalize="off">
    <div class="chip-row">${chip("all", "All")}${chip("need", "Need")}${chip("progress", "In progress")}${chip("maxed", "Maxed")}</div>
    <div class="filter-meta">
      <select id="variantFilter" onchange="setFilter('variant',this.value)"><option value="">Any style</option>${opts}</select>
      <div class="filter-count" id="filterCount"></div>
    </div>
  </div>
  <div class="filter-empty" id="filterEmpty" hidden>No sprites match that filter.</div>`;
}
function setFilter(key, val) {
  filters[key] = val;
  filterSnap = { sig: "", ids: null }; // force a fresh pass
  applyFilters();
}
function applyFilters() {
  const bar_ = document.getElementById("filterBar");
  if (!bar_) return;
  const cards = Array.from(document.querySelectorAll("#app .sprite-card[data-name]"));
  const q = filters.q.trim().toLowerCase();
  const qv = q.replace(/\s+/g, "");
  const sig = [state.season, appState.activeId, state.sortMode, state.sortModeS4, filters.q, filters.status, filters.variant].join("|");
  // Taps re-render the page; keep the same cards visible so rows never jump under your finger.
  const reuse = filterSnap.ids && filterSnap.sig === sig;
  const ids = new Set();
  let shown = 0;
  cards.forEach(card => {
    const tiles = Array.from(card.querySelectorAll(".toggle"));
    tiles.forEach(t => { t.hidden = !!filters.variant && t.dataset.variant !== filters.variant; });
    let ok;
    if (reuse) {
      ok = filterSnap.ids.has(card.dataset.id);
    } else {
      const tl = tiles.filter(t => !t.hidden);
      const lv = tl.map(t => +t.dataset.lvl);
      ok = tl.length > 0;
      if (ok && q) ok = card.dataset.name.includes(q) || tl.some(t => t.dataset.variant.includes(qv) || variantLabel(t.dataset.variant).toLowerCase().includes(q));
      if (ok && filters.status === "need") ok = lv.some(l => l === 0);
      if (ok && filters.status === "progress") ok = lv.some(l => l > 0 && l < 5);
      if (ok && filters.status === "maxed") ok = lv.every(l => l === 5);
    }
    card.hidden = !ok;
    if (ok) { ids.add(card.dataset.id); shown++; }
  });
  filterSnap = { sig, ids: reuse ? filterSnap.ids : ids };
  const cnt = document.getElementById("filterCount");
  if (cnt) cnt.textContent = `${shown} of ${cards.length}`;
  const empty = document.getElementById("filterEmpty");
  if (empty) empty.hidden = shown !== 0;
  document.querySelectorAll("#filterBar .chip").forEach(c => c.classList.toggle("active", c.dataset.status === filters.status));
}

let undoStack = [];
let toastTimer = null;
function snapshotInv() { return JSON.stringify({ a: state.inventory, b: state.inventoryS4, c: state.codes }); }
function pushUndo(label, showToast) {
  undoStack.push({ label, profId: appState.activeId, snap: snapshotInv() });
  if (undoStack.length > 30) undoStack.shift();
  updateUndoBtn();
  if (showToast) toast(label);
}
function undoLast() {
  const u = undoStack.pop();
  if (!u) return;
  if (u.profId !== appState.activeId) { undoStack = []; updateUndoBtn(); return; }
  const s = JSON.parse(u.snap);
  state.inventory = s.a; state.inventoryS4 = s.b; state.codes = s.c;
  saveState();
  hideToast();
  render();
  toast("Undid: " + u.label, false);
}
function updateUndoBtn() {
  const b = document.getElementById("undoBtn");
  if (!b) return;
  const top = undoStack[undoStack.length - 1];
  b.classList.toggle("show", !!top && top.profId === appState.activeId && currentPage === "checklist");
}
function toast(msg, withUndo = true) {
  const t = document.getElementById("toast");
  if (!t) return;
  t.innerHTML = `<span>${esc(msg)}</span>${withUndo ? '<button type="button" onclick="undoLast()">Undo</button>' : ""}`;
  t.classList.add("show");

}

async function regenShare() {
  const seq = ++shareState.seq;
  const prev = document.getElementById("sharePreview");
  const go = document.getElementById("shareGo");
  if (!prev) return;
  prev.textContent = "Generating…";
  if (go) go.disabled = true;
  shareState.blob = null;
  if (typeof html2canvas === "undefined") { prev.textContent = "The image tool didn't load — check your connection and reopen."; return; }
  const host = document.createElement("div");
  host.style.cssText = "position:fixed;left:-20000px;top:0;pointer-events:none;";
  const { w, h } = SHARE_FMT[shareState.fmt];
  const card = buildShareCard(shareState.kind, shareState.fmt);
  host.appendChild(card);
  document.body.appendChild(host);
  try {
    if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) {} }
    const canvas = await html2canvas(card, { useCORS: true, allowTaint: true, scale: 1, backgroundColor: "#0b0e14", logging: false, width: w, height: h });
    if (seq !== shareState.seq) return;
    const blob = await new Promise(r => canvas.toBlob(r, "image/png"));
    if (seq !== shareState.seq) return;
    if (shareState.url) URL.revokeObjectURL(shareState.url);
    shareState.blob = blob;
    shareState.url = URL.createObjectURL(blob);
    const p2 = document.getElementById("sharePreview");
    if (p2) p2.innerHTML = `<img src="${shareState.url}" alt="Share card preview">`;
    const g2 = document.getElementById("shareGo");
    if (g2) g2.disabled = false;
  } catch (e) {
    console.error("Share card failed:", e);
    const p2 = document.getElementById("sharePreview");
    if (p2 && seq === shareState.seq) p2.textContent = "Couldn't build the card. Try again.";
  } finally {
    host.remove();
  }
}
function doShare() {

  const fileName = `${nm}_${shareState.kind}_${shareState.fmt}.png`;

    navigator.share({ files: [file], title: "My Sprite Checklist", text: "Track yours at sprites.tyrantnetworks.com" }).catch(() => {});

let newsData = null, newsLoading = false, newsError = false;
async function loadNews() {
  newsLoading = true; newsError = false;
  if (currentPage === "news") render();
  try {
    const res = await fetch("https://fortnite-api.com/v2/news/br");
    if (!res.ok) throw new Error("News request failed: " + res.status);
    const json = await res.json();
    const d = json.data || {};
    newsData = (d.motds || d.messages || []).filter(m => m && (m.title || m.body));
  } catch (e) {
    console.error("News load error:", e);
    newsError = true;
  }
  newsLoading = false;
  if (currentPage === "news") render();
}
function newsUnread() {
  try { return localStorage.getItem(NEWS_SEEN_KEY) !== SITE_UPDATES[0].id; } catch (e) { return false; }
}
function markNewsSeen() { try { localStorage.setItem(NEWS_SEEN_KEY, SITE_UPDATES[0].id); } catch (e) {} }
function renderNews() {
  const updates = SITE_UPDATES.map(u => `<div class="news-card"><div class="nb">
      <div class="nd">${esc(u.date)}</div><h3>${esc(u.title)}</h3>
      <ul>${u.items.map(i => `<li>${esc(i)}</li>`).join("")}</ul></div></div>`).join("");
  let fn;
  if (newsLoading) fn = `<div class="loading">Loading Fortnite news…</div>`;
  else if (newsError) fn = `<div class="filter-empty">Couldn't load Fortnite news right now.<br><br><button type="button" class="sheet-btn" onclick="loadNews()">Try again</button></div>`;
  else if (newsData && newsData.length) {
    fn = newsData.map(m => {
      const img = m.image || m.tileImage || "";
      return `<div class="news-card">${img ? `<img src="${esc(img)}" alt="" loading="lazy">` : ""}<div class="nb"><h3>${esc(m.title || m.tabTitle || "")}</h3><p>${esc(m.body || "")}</p></div></div>`;
    }).join("");
  } else fn = `<div class="filter-empty">No Fortnite news posted right now.</div>`;
  return `<div class="news-head">Sprite Checklist updates</div>${updates}<div class="news-head">Fortnite news</div>${fn}`;
}

async function api(path, opts = {}) {
  const res = await fetch(API_BASE + path, Object.assign({}, opts, {
    headers: Object.assign({ "Content-Type": "application/json" }, authHeaders(), opts.headers || {})
  }));
  let body = null;
  try { body = await res.json(); } catch (e) {}
  if (!res.ok) {
    const d = body && body.detail;
    const err = new Error(typeof d === "string" ? d : "Request failed (" + res.status + ")");
    err.status = res.status;
    throw err;
  }
  return body;
}
function loggedIn() { const u = getDiscordUser(); return !!(u && u.token) && !authProblem; }
function avatarImg(url, cls) { return `<img class="${cls}" src="${esc(url || "")}" alt="" onerror="this.style.visibility='hidden'">`; }
function itemLabel(sid, v) {

async function setPrivacy(key, value, thenTrades) {
  if (!meData || meSaving) return;
  const prev = Object.assign({}, meData.settings);
  meData.settings[key] = value;
  if (!meData.settings.sheet_id || !appState.profiles[meData.settings.sheet_id]) meData.settings.sheet_id = appState.activeId;
  if (key === "sheet_id" && !value) meData.settings.sheet_id = null;
  meSaving = true; render();
  try {
    // make sure the server has your latest checklist before it starts using it
    clearTimeout(syncTimer); syncTimer = null; pushToServer();
    await api("/api/profile/settings", { method: "PUT", body: JSON.stringify(meData.settings) });
    lbData = null; tradeData = null;
    meSaving = false; render();
    if (thenTrades) loadTrades();
    if (socialTab === "leaderboard") loadLeaderboard(true);
  } catch (e) {
    meData.settings = prev; meSaving = false; render();
    toast(e.message || "Couldn't save that setting", false);
  }
}

function openProfile(id) {

  catch (e) { profileView.error = e.status === 404 ? "This profile is private or doesn't exist." : (e.message || "Couldn't load this profile."); profileView.data = null; }

function leaveProfile() {

  const cards = list.map(sp => {
    const isSingle = sp.variants.length === 1;

      if (lvl === 5) { cls = "max-lvl " + v; label = isSingle ? "MAX" : v.toUpperCase() + " MAX"; }

      return `<div class="toggle ${cls}"><img class="variant-icon" src="${img}" onerror="this.style.opacity='0.15';" alt=""><div class="toggle-label">${esc(label)}</div></div>`;
    }).join("");

// ================= BATCH 3: NEWS NOTIFICATIONS (Web Push) =================
function isIOS() { return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); }
function pushSupported() { return "serviceWorker" in navigator && "PushManager" in window && "Notification" in window; }
function urlB64ToUint8Array(b64) {
  const pad = "=".repeat((4 - b64.length % 4) % 4);
  const raw = atob((b64 + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(raw, c => c.charCodeAt(0));
}
async function refreshPushSection() {
  const box = document.getElementById("pushBox");
  if (!box) return;
  const note = t => { box.innerHTML = `<div class="set-note">${t}</div>`; };
  if (!pushSupported()) {
    note(isIOS() && !isStandalone()
      ? "To get alerts on iPhone/iPad, first add this site to your Home Screen (Share → Add to Home Screen), open it from there, then come back to this switch."
      : "This browser doesn't support notifications.");
    return;
  }
  if (Notification.permission === "denied") { note("Notifications are blocked for this site. Re-enable them in your device or browser settings, then reopen this menu."); return; }
  let sub = null;
  try { const reg = await navigator.serviceWorker.getRegistration(); sub = reg ? await reg.pushManager.getSubscription() : null; } catch (e) {}
  box.innerHTML = sub
    ? `<div class="set-note">✅ Alerts are on for this device.</div><button type="button" class="mini-btn" onclick="disablePush()">Turn off</button>`
    : `<button type="button" class="big-btn" onclick="enablePush()">🔔 Turn on news alerts</button>`;
}
async function enablePush() {
  const box = document.getElementById("pushBox");
  if (box) box.innerHTML = `<div class="set-note">Setting up…</div>`;
  try {
    const perm = await Notification.requestPermission();
    if (perm !== "granted") { await refreshPushSection(); return; }
    const reg = await navigator.serviceWorker.ready;
    const { key } = await api("/api/push/key");
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToUint8Array(key) });
    await api("/api/push/subscribe", { method: "POST", body: JSON.stringify(sub.toJSON()) });
    toast("News alerts are on 🔔", false);
  } catch (e) {
    console.error("Push setup failed:", e);
    toast(e.status === 503 ? "Alerts aren't available on the server yet." : "Couldn't turn on alerts. Try again.", false);
  }
  await refreshPushSection();
}
async function disablePush() {
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg ? await reg.pushManager.getSubscription() : null;
    if (sub) {
      const endpoint = sub.endpoint;
      await sub.unsubscribe();
      api("/api/push/unsubscribe", { method: "POST", body: JSON.stringify({ endpoint }) }).catch(() => {});
    }
  } catch (e) { console.error(e); }
  await refreshPushSection();
}


// --- INITIALIZATION & OAUTH ENGINE ---
const urlParams = new URLSearchParams(window.location.search);
const authCode = urlParams.get('code');

if (authCode) {
  document.getElementById('app').innerHTML = '<div class="loading">Authenticating with Discord...</div>';
  fetch("https://sapi.tyrantnetworks.com/auth/discord", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ code: authCode })
  })
  .then(response => response.json())
  .then(data => {
    window.history.replaceState({}, document.title, window.location.pathname);
    if (data.user_id && data.token) {
      localStorage.setItem("discord_user", JSON.stringify(data));
    } else {
      console.error("Discord login failed:", data);
    }
    loadState();
  })
  .catch(error => {
    console.error("Discord Auth Failed:", error);
    window.history.replaceState({}, document.title, window.location.pathname);
    loadState();
  });
} else {
  if (urlParams.get('page') === 'news') { currentPage = 'news'; markNewsSeen(); loadNews(); }
  const deepId = urlParams.get('u');
  if (deepId && /^\d{5,25}$/.test(deepId)) {
    currentPage = "profile";
    profileView = { id: deepId, data: null, loading: true, error: "", from: "checklist" };
    loadProfile(deepId);
  }
  loadState();
}
</script>
