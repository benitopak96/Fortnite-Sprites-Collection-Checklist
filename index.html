<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fortnite Sprite Checklist</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&display=swap');

  :root {
    --bg: #0b0e14;
    --panel: #11151f;
    --gold: #e8b339;
    --gummy: #ff5fa3;
    --galaxy: #7c6cf0;
    --gem: #a3e2f7;
    --holofoil: #e0abf5;
    --cube: #b847ff;
    --quack: #ffb703;
    --cheat: #39e678;
    --loot: #ff9f43;
    --bounty: #ff2f6e;
    --have: #2ee6a6;
    --need: #ff5566;
    --ink: #eef0f6;
    --ink-dim: #8d93a8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(124,108,240,0.18), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(232,179,57,0.10), transparent 50%);
    font-family: 'Space Grotesk', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    padding: 14px 12px 16px;
  }

  .export-container {
    background: var(--bg);
    padding: 4px;
    border-radius: 12px;
    width: 100%;
  }

  .wrap { max-width: 640px; margin: 0 auto; }
  
  /* Discord Integration UI */
  .discord-panel {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(124,108,240,0.1);
    border: 1px solid rgba(124,108,240,0.3);
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 12px;
  }
  .discord-status {
    font-size: 13px;
    color: var(--ink);
  }
  .discord-status strong { color: var(--galaxy); }
  .discord-login-btn {
    background: var(--galaxy);
    color: white;
    text-decoration: none;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 4px;
    transition: all 0.2s;
  }
  .discord-login-btn:hover { background: #5b49db; }

  /* Sheet Manager UI */
  .sheet-manager {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    background: var(--panel);
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid #1d2331;
    align-items: center;
  }
  .sheet-selector, .sort-selector {
    flex-grow: 1;
    background: #161b27;
    color: var(--gold);
    border: 1px solid #1d2331;
    padding: 6px;
    border-radius: 4px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    outline: none;
    cursor: pointer;
  }
  .season-selector {
    flex-grow: 1;
    background: #161b27;
    color: var(--galaxy);
    border: 1px solid #1d2331;
    padding: 8px;
    border-radius: 4px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 15px;
    letter-spacing: 0.5px;
    outline: none;
    cursor: pointer;
  }
  .sheet-btn {
    background: #161b27;
    color: var(--ink);
    border: 1px solid #1d2331;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12px;
    transition: all 0.2s;
    font-weight: 600;
  }
  .sheet-btn:hover { border-color: var(--galaxy); color: var(--galaxy); }
  .sheet-btn.delete { color: var(--need); border-color: #3a1a1f; background: rgba(255,85,102,0.05); }
  .sheet-btn.delete:hover { border-color: var(--need); background: rgba(255,85,102,0.15); }

  /* Tab row (Sprites / Lobby Hack Codes) for Season 4 */
  .tab-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .tab-btn {
    flex: 1; background: var(--panel); border: 1px solid #1d2331; color: var(--ink-dim);
    padding: 10px; border-radius: 8px; font-family: 'Bebas Neue', sans-serif; font-size: 15px;
    letter-spacing: 0.5px; cursor: pointer; transition: all 0.15s ease;
  }
  .tab-btn.active { border-color: var(--galaxy); color: var(--galaxy); background: rgba(124,108,240,0.08); }
  .tab-btn:hover { border-color: #3a4154; }

  /* Unreleased Toggle Switch Bar */
  .toggle-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--panel);
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid #1d2331;
    margin-bottom: 12px;
    font-size: 13px;
    font-weight: 600;
  }
  .switch {
    position: relative;
    display: inline-block;
    width: 42px;
    height: 22px;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
    background-color: #161b27; border: 1px solid #1d2331; transition: .2s; border-radius: 22px;
  }
  .slider:before {
    position: absolute; content: ""; height: 16px; width: 16px; left: 2px; bottom: 2px;
    background-color: var(--ink-dim); transition: .2s; border-radius: 50%;
  }
  input:checked + .slider { background-color: var(--galaxy); border-color: var(--galaxy); }
  input:checked + .slider:before { transform: translateX(20px); background-color: white; }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid #1d2331;
    padding-bottom: 10px;
    margin-bottom: 8px;
    gap: 10px;
  }

  .title-block .eyebrow {
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--galaxy);
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 2px;
  }

  .title-block h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 1px;
    line-height: 1;
  }

  .epic-tag { text-align: right; min-width: 140px; }

  .epic-tag .label {
    font-size: 10px;
    color: var(--ink-dim);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 2px;
  }

  .username-input {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    color: var(--gold);
    letter-spacing: 1px;
    background: #161b27;
    border: 1px solid #1d2331;
    border-radius: 4px;
    padding: 2px 6px;
    text-align: right;
    width: 100%;
    outline: none;
    transition: border-color 0.2s;
  }
  
  .username-input:focus { border-color: var(--gold); }

  .username-static {
    display: none;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    color: var(--gold);
    letter-spacing: 1px;
    text-align: right;
    padding-right: 2px;
  }

  .hint {
    font-size: 12px;
    color: var(--ink-dim);
    line-height: 1.3;
    text-align: center;
    margin-bottom: 12px;
  }

  .export-btn {
    font-family: 'Bebas Neue', sans-serif;
    background: linear-gradient(135deg, var(--galaxy), #5b49db);
    color: white;
    border: none;
    font-size: 18px;
    padding: 14px;
    border-radius: 12px;
    cursor: pointer;
    letter-spacing: 0.5px;
    box-shadow: 0 4px 12px rgba(124,108,240,0.3);
    white-space: nowrap;
    transition: transform 0.1s ease;
    width: 100%;
    margin-top: 12px;
  }

  /* Social Export Mode Constraints */
  .social-export-mode {
    width: 580px !important; 
    padding: 12px !important;
  }

  .social-export-mode .username-input { display: none !important; }
  .social-export-mode .username-static { display: block !important; }
  .social-export-mode .max-row-btn { display: none !important; }
  .social-export-mode .sheet-manager { display: none !important; }
  .social-export-mode .discord-panel { display: none !important; }
  .social-export-mode .toggle-bar { display: none !important; }
  .social-export-mode .tab-row { display: none !important; }

  .social-export-mode .header {
    padding-left: 4px !important;
    padding-right: 8px !important;
    margin-bottom: 12px !important;
  }

  .social-export-mode .sprites-grid {
    display: grid !important;
    grid-template-columns: repeat(3, 1fr) !important;
    gap: 6px !important;
  }

  .social-export-mode .sprite-card {
    padding: 6px 4px !important;
    gap: 5px !important;
    border-radius: 8px !important;
  }

  .social-export-mode .sprite-name { font-size: 11px !important; letter-spacing: 0px !important; }
  .social-export-mode .variants-row { gap: 3px !important; }
  .social-export-mode .variant-icon { width: 22px !important; height: 22px !important; }

  .social-export-mode .toggle {
    padding: 3px 1px !important;
    border-radius: 4px !important;
    min-width: 0 !important;
    width: calc(25% - 3px) !important;
  }

  .social-export-mode .sprite-card:has(.toggle:nth-child(5)) .toggle {
    width: calc(20% - 3px) !important;
  }
  .social-export-mode .sprite-card:has(.toggle:nth-child(6)) .toggle {
    width: calc(16.66% - 3px) !important;
  }
  .social-export-mode .sprite-card:has(.toggle:nth-child(7)) .toggle {
    width: calc(14.28% - 3px) !important;
  }

  .social-export-mode .toggle-label {
    font-size: 5px !important;
    letter-spacing: -0.2px !important;
    transform: scale(0.95);
  }

  .social-export-mode .legend-bar { display: none !important; }
  .social-export-mode .footer-bar { margin-top: 12px !important; padding: 10px !important; }

  .export-watermark { display: none; }
  .social-export-mode .export-watermark {
    display: block !important;
    text-align: center;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink-dim);
    margin-top: 14px;
    padding-top: 12px;
    border-top: 2px dashed #1d2331;
    letter-spacing: 0.5px;
  }
  .social-export-mode .export-watermark span {
    color: var(--gold);
    margin-left: 4px;
  }

  .sprites-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
  .sprite-card { background: var(--panel); border: 1px solid #1d2331; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .sprite-info { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .sprite-name { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 0.5px; line-height: 1; text-transform: uppercase; }
  .sprite-name-wrap { display: flex; flex-direction: column; gap: 2px; }
  .sprite-rarity { font-size: 9px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; }
  .rarity-mythic { color: #ff8a3d; }
  .rarity-legendary { color: var(--gold); }
  .rarity-epic { color: var(--galaxy); }
  .rarity-rare { color: var(--gem); }

  .max-row-btn {
    font-family: 'Bebas Neue', sans-serif; font-size: 12px; color: var(--ink-dim); background: #161b27;
    border: 1px solid #1d2331; padding: 2px 6px; border-radius: 4px; cursor: pointer; letter-spacing: 0.5px; transition: all 0.1s ease;
  }
  .max-row-btn:hover { color: var(--gold); border-color: var(--gold); }

  .variants-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .variants-row .toggle { width: calc(25% - 5px); min-width: 68px; }
  .variants-row.single-variant .toggle { width: 100%; }

  .toggle {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    padding: 8px 4px; border-radius: 8px; border: 2px solid #1d2331; background: #161b27;
    cursor: pointer; transition: all 0.15s ease; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  .toggle:hover { border-color: #3a4154; }

  .toggle.have.normal { border-color: rgba(184,191,209,0.3); background: rgba(184,191,209,0.04); }
  .toggle.have.gold { border-color: rgba(232,179,57,0.3); background: rgba(232,179,57,0.04); }
  .toggle.have.gummy { border-color: rgba(255,95,163,0.3); background: rgba(255,95,163,0.04); }
  .toggle.have.galaxy { border-color: rgba(124,108,240,0.3); background: rgba(124,108,240,0.04); }
  .toggle.have.gem { border-color: rgba(163,226,247,0.3); background: rgba(163,226,247,0.04); }
  .toggle.have.holofoil { border-color: rgba(224,171,245,0.3); background: rgba(224,171,245,0.04); }
  .toggle.have.cube { border-color: rgba(184,71,255,0.3); background: rgba(184,71,255,0.04); }
  .toggle.have.quack { border-color: rgba(255,183,3,0.3); background: rgba(255,183,3,0.04); }
  .toggle.have.ironmouse { border-color: rgba(224,171,245,0.3); background: rgba(224,171,245,0.04); }
  .toggle.have.johnwick { border-color: rgba(224,171,245,0.3); background: rgba(224,171,245,0.04); }
  .toggle.have.peanut { border-color: rgba(224,171,245,0.3); background: rgba(224,171,245,0.04); }
  .toggle.have.vinijr { border-color: rgba(224,171,245,0.3); background: rgba(224,171,245,0.04); }
  .toggle.have.pollo { border-color: rgba(224,171,245,0.3); background: rgba(224,171,245,0.04); }
  .toggle.have.cheatmaster { border-color: rgba(57,230,120,0.3); background: rgba(57,230,120,0.04); }
  .toggle.have.loothacker { border-color: rgba(255,159,67,0.3); background: rgba(255,159,67,0.04); }
  .toggle.have.bountyhacker { border-color: rgba(255,47,110,0.3); background: rgba(255,47,110,0.04); }
  .toggle.have.bountyhunter { border-color: rgba(255,47,110,0.3); background: rgba(255,47,110,0.04); }

  .toggle.max-lvl { border-width: 2px; }
  .toggle.max-lvl.normal { border-color: rgba(184,191,209,0.9); background: rgba(184,191,209,0.12); }
  .toggle.max-lvl.gold { border-color: rgba(232,179,57,0.9); background: rgba(232,179,57,0.12); }
  .toggle.max-lvl.gummy { border-color: rgba(255,95,163,0.9); background: rgba(255,95,163,0.12); }
  .toggle.max-lvl.galaxy { border-color: rgba(124,108,240,0.9); background: rgba(124,108,240,0.14); }
  .toggle.max-lvl.gem { border-color: rgba(163,226,247,0.9); background: rgba(163,226,247,0.15); }
  .toggle.max-lvl.holofoil { border-color: rgba(224,171,245,0.9); background: rgba(224,171,245,0.15); }
  .toggle.max-lvl.cube { border-color: rgba(184,71,255,0.9); background: rgba(184,71,255,0.14); }
  .toggle.max-lvl.quack { border-color: rgba(255,183,3,0.9); background: rgba(255,183,3,0.14); }
  .toggle.max-lvl.ironmouse { border-color: rgba(224,171,245,0.9); background: rgba(224,171,245,0.15); }
  .toggle.max-lvl.johnwick { border-color: rgba(224,171,245,0.9); background: rgba(224,171,245,0.15); }
  .toggle.max-lvl.peanut { border-color: rgba(224,171,245,0.9); background: rgba(224,171,245,0.15); }
  .toggle.max-lvl.vinijr { border-color: rgba(224,171,245,0.9); background: rgba(224,171,245,0.15); }
  .toggle.max-lvl.pollo { border-color: rgba(224,171,245,0.9); background: rgba(224,171,245,0.15); }
  .toggle.max-lvl.cheatmaster { border-color: rgba(57,230,120,0.9); background: rgba(57,230,120,0.14); }
  .toggle.max-lvl.loothacker { border-color: rgba(255,159,67,0.9); background: rgba(255,159,67,0.14); }
  .toggle.max-lvl.bountyhacker { border-color: rgba(255,47,110,0.9); background: rgba(255,47,110,0.14); }
  .toggle.max-lvl.bountyhunter { border-color: rgba(255,47,110,0.9); background: rgba(255,47,110,0.14); }

  .variant-icon { width: 44px; height: 44px; object-fit: contain; opacity: 0.3; transition: opacity 0.15s ease; pointer-events: none; }
  .toggle.have .variant-icon { opacity: 0.75; }
  .toggle.max-lvl .variant-icon { opacity: 1; }

  .toggle-label { font-size: 10px; font-weight: 700; letter-spacing: 0.1px; line-height: 1.1; margin-top: 2px; pointer-events: none; }
  .toggle.have .toggle-label { color: var(--have); }
  .toggle.max-lvl .toggle-label { color: var(--gold) !important; font-weight: 900; letter-spacing: 0.5px; }
  .toggle:not(.have) .toggle-label { color: var(--need); }

  /* Lobby Hack Codes list */
  .codes-list { display: flex; flex-direction: column; gap: 6px; }
  .code-row {
    display: flex; align-items: center; gap: 10px; padding: 8px 8px; border-radius: 8px;
    border: 2px solid #1d2331; background: #161b27; cursor: pointer; transition: all 0.15s ease;
    user-select: none; -webkit-user-select: none;
  }
  .code-row:hover { border-color: #3a4154; }
  .code-row.claimed { border-color: rgba(46,230,166,0.6); background: rgba(46,230,166,0.06); }
  .code-check {
    width: 22px; height: 22px; flex-shrink: 0; border-radius: 5px; border: 2px solid var(--ink-dim);
    display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 900; color: var(--have);
  }
  .code-row.claimed .code-check { border-color: var(--have); }
  .code-info { display: flex; flex-direction: column; gap: 1px; }
  .code-text { font-family: 'Bebas Neue', sans-serif; font-size: 15px; letter-spacing: 0.5px; color: var(--ink); }
  .code-row.claimed .code-text { color: var(--have); }
  .code-reward { font-size: 11px; color: var(--ink-dim); }

  .legend-bar { font-size: 11px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.5px; margin: 8px 2px 4px; display: flex; justify-content: space-between; align-items: center; }
  .link-group { display: flex; gap: 8px; align-items: center; }
  .tip-link { font-family: 'Space Grotesk', sans-serif; font-weight: 600; color: var(--gold); text-decoration: none; font-size: 11px; display: inline-flex; align-items: center; gap: 5px; border: 1px dashed rgba(232,179,57,0.4); padding: 4px 8px; border-radius: 6px; background: rgba(232,179,57,0.03); transition: all 0.1s ease; }
  .tip-link:hover { background: rgba(232,179,57,0.08); border-color: var(--gold); }
  .discord-link { color: var(--galaxy); border-color: rgba(124,108,240,0.4); background: rgba(124,108,240,0.03); }
  .discord-link:hover { background: rgba(124,108,240,0.08); border-color: var(--galaxy); }

  .footer-bar { margin-top: 8px; display: flex; flex-direction: column; align-items: flex-start; background: var(--panel); border-radius: 12px; padding: 12px 14px; border: 1px solid #1d2331; gap: 8px; }
  .progress-label { font-size: 11px; color: var(--ink-dim); letter-spacing: 0.2px; line-height: 1.3; }
  .progress-track { width: 100%; height: 8px; background: #1d2331; border-radius: 100px; overflow: hidden; margin-top: 6px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gummy), var(--galaxy)); transition: width 0.3s ease; }
  .cta { font-family: 'Bebas Neue', sans-serif; font-size: 15px; color: var(--ink); line-height: 1.2; }
  .cta span { color: var(--gold); }
  .loading { text-align: center; color: var(--ink-dim); padding: 40px; font-size: 14px; }
  .reset-btn { background: none; border: 1px solid #3a4154; color: var(--ink-dim); font-size: 12px; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-family: 'Space Grotesk', sans-serif; }
  .reset-btn:hover { border-color: var(--need); color: var(--need); }
</style>
</head>
<body>
  <div class="wrap" id="app">
    <div class="loading">Loading your collection grid…</div>
  </div>

<script>
// ============ SEASON 3 SPRITE DEFINITIONS (unchanged) ============
const SPRITES_ORGANIZE = [
  { id: "johnwick", name: "John Wick", variants: ["johnwick"] },
  { id: "batman", name: "Batman", variants: ["normal","gold","gummy","galaxy","holofoil","cube"] },
  { id: "water", name: "Water", variants: ["normal","gold","gummy","galaxy","gem","holofoil","quack"] },
  { id: "earth", name: "Earth", variants: ["normal","gold","gummy","galaxy","gem","cube","quack"] },
  { id: "fire", name: "Fire", variants: ["normal","gold","gummy","galaxy","holofoil","cube","quack"] },
  { id: "duck", name: "Duck", variants: ["normal","gold","gummy","galaxy","gem"] },
  { id: "ghost", name: "Ghost", variants: ["normal","gold","gummy","galaxy","holofoil"] },
  { id: "dream", name: "Dream", variants: ["normal","gold","gummy","galaxy","cube"] },
  { id: "demon", name: "Demon", variants: ["normal","gold","gummy","galaxy","gem"] },
  { id: "punk", name: "Punk", variants: ["normal","gold","gummy","galaxy","cube", "gem"] },
  { id: "king", name: "King", variants: ["normal","gold","gummy","galaxy","holofoil"] },
  { id: "burntpeanut", name: "Burnt Peanut", variants: ["peanut"] },
  { id: "vinijr", name: "Vini Jr", variants: ["vinijr"] },
  { id: "zeropoint", name: "Zero Point", variants: ["normal","gold","gummy","galaxy","gem","cube","quack","holofoil"] },
  { id: "fishy", name: "Fishy", variants: ["normal","gold","gummy","galaxy","cube"] },
  { id: "striker", name: "Striker", variants: ["normal","gold","gummy","galaxy","holofoil"] },
  { id: "aura", name: "Aura", variants: ["normal","gold","gummy","galaxy","gem"] },
  { id: "boss", name: "Boss", variants: ["normal","gold","gummy","galaxy","cube"] },
  { id: "grimreaper", name: "Grim", variants: ["normal","gold","gummy","galaxy","cube","gem","holofoil"] },
  { id: "air", name: "Air", variants: ["normal","gold","gummy","galaxy","holofoil"] },

// --- API SYNC ENGINE ---
function syncToVPS() {
  const user = JSON.parse(localStorage.getItem("discord_user"));
  if (!user) return; 

  fetch("https://sapi.tyrantnetworks.com/api/sprites/save", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ user_id: user.user_id, collection_data: [appState] })
  }).catch(e => console.error("Database sync failed:", e));
}

function normalizeProfiles(app) {
  Object.keys(app.profiles).forEach(profId => {
    let prof = app.profiles[profId];
    if (!prof.sortMode) prof.sortMode = "organize";
    if (prof.showUnreleased === undefined) prof.showUnreleased = true;
    if (!prof.season) prof.season = "s3";
    if (!prof.view) prof.view = "sprites";
    if (!prof.inventory) prof.inventory = {};
    if (!prof.inventoryS4) prof.inventoryS4 = {};
    if (!prof.codes) prof.codes = {};

    Object.keys(ALL_VARIANTS_MAP).forEach(id => {
      if (!prof.inventory[id]) prof.inventory[id] = {};
      ALL_VARIANTS_MAP[id].forEach(v => { if (prof.inventory[id][v] === undefined) prof.inventory[id][v] = 0; });
    });

    SEASON4_SPRITES.forEach(s => {
      if (!prof.inventoryS4[s.id]) prof.inventoryS4[s.id] = {};
      s.variants.forEach(v => { if (prof.inventoryS4[s.id][v] === undefined) prof.inventoryS4[s.id][v] = 0; });
    });

    LOBBY_CODES.forEach(c => { if (prof.codes[c.code] === undefined) prof.codes[c.code] = false; });
  });
  if (!app.profiles[app.activeId]) {
    app.activeId = Object.keys(app.profiles)[0];
  }
}

function loadState() {
  const savedMulti = localStorage.getItem(MULTI_STORAGE_KEY);
  if (savedMulti) {
    appState = JSON.parse(savedMulti);
  } else {
    const legacySaved = localStorage.getItem(LEGACY_KEY);
    if (legacySaved) appState.profiles["default"].inventory = JSON.parse(legacySaved);
  }

  normalizeProfiles(appState);
  state = appState.profiles[appState.activeId];
  render();

  const user = JSON.parse(localStorage.getItem("discord_user"));
  if (user) {
    fetch(`https://sapi.tyrantnetworks.com/api/sprites/${user.user_id}`)
      .then(res => res.json())
      .then(data => {
        if (data.collection_data && data.collection_data.length > 0) {
          appState = data.collection_data[0];
          normalizeProfiles(appState);
          state = appState.profiles[appState.activeId];
          localStorage.setItem(MULTI_STORAGE_KEY, JSON.stringify(appState));
          render();
        }
      }).catch(e => console.error("VPS Load error:", e));
  }
}

function saveState() {
  try {
    appState.profiles[appState.activeId] = state;
    localStorage.setItem(MULTI_STORAGE_KEY, JSON.stringify(appState));
    syncToVPS();
  } catch (e) { console.error("Failed to save state:", e); }
}

// INVENTORY CONTROLS
function handleTileTap(spriteId, variant) {
  if (isLongPress) return;
  const inv = getActiveInventory();
  let currentLevel = inv[spriteId][variant] || 0;
  let nextLevel = currentLevel + 1;
  if (nextLevel > 5) nextLevel = 0;
  inv[spriteId][variant] = nextLevel;
  saveState();
  render();
}

function handleLongPress(spriteId, variant) {
  getActiveInventory()[spriteId][variant] = 5;
  saveState();
  render();
}

function maxEntireRow(spriteId, activeVariants) {
  const inv = getActiveInventory();
  activeVariants.forEach(v => { inv[spriteId][v] = 5; });
  saveState();
  render();
}

function toggleCode(code) {
  state.codes[code] = !state.codes[code];
  saveState();
  render();
}

function setupTouchListeners(element, spriteId, variant) {
  const startHandler = (e) => {
    isLongPress = false;
    touchTimer = setTimeout(() => {
      isLongPress = true;
      handleLongPress(spriteId, variant);
    }, 400);
  };
  const endHandler = (e) => {
    if (touchTimer) clearTimeout(touchTimer);
    if (!isLongPress) handleTileTap(spriteId, variant);
  };
  const cancelHandler = () => { if (touchTimer) clearTimeout(touchTimer); };

  element.addEventListener('touchstart', startHandler, { passive: true });
  element.addEventListener('touchend', endHandler);
  element.addEventListener('touchmove', cancelHandler, { passive: true });
  element.addEventListener('mousedown', startHandler);
  element.addEventListener('mouseup', endHandler);
  element.addEventListener('mouseleave', cancelHandler);
}

function updateUsername(newName) {
  state.username = newName;
  saveState();
  const staticBlock = document.getElementById("username-mirror");
  if(staticBlock) staticBlock.innerText = newName || "PLAYER";
  const ctaName = document.getElementById("cta-username");
  if(ctaName) ctaName.innerText = newName || "[Input Username]";
}

function resetAll() {
  const label = state.season === "s4" ? (state.view === "codes" ? "Lobby Hack Codes" : "Season 4 checklist") : "Season 3 checklist";
  if (!confirm(`Clear this ${label} and reset it?`)) return;
  if (state.season === "s4" && state.view === "codes") {
    LOBBY_CODES.forEach(c => { state.codes[c.code] = false; });
  } else if (state.season === "s4") {

      state.inventoryS4[s.id] = {};
      s.variants.forEach(v => { state.inventoryS4[s.id][v] = 0; });

    Object.keys(DEFAULT_STATE.inventory).forEach(id => {
      state.inventory[id] = JSON.parse(JSON.stringify(DEFAULT_STATE.inventory[id]));
    });
  }
  saveState();
  render();
}

function exportAsImage() {
  const targetElement = document.getElementById("capture-area");
  const exportBtn = document.querySelector(".export-btn");
  exportBtn.innerText = "Generating Share Screen...";
  targetElement.classList.add("social-export-mode");
  
  setTimeout(() => {
    html2canvas(targetElement, {
      useCORS: true, allowTaint: true, scale: 2, backgroundColor: "#0b0e14", width: 580, logging: false
    }).then(canvas => {
      const nameString = state.username ? state.username.replace(/\s+/g, '_') : 'My';
      const seasonTag = state.season === "s4" ? "S4" : "S3";
      const fileName = `${nameString}_Fortnite_${seasonTag}_Checklist.png`;
      canvas.toBlob(blob => {
        const imageFile = new File([blob], fileName, { type: "image/png" });
        if (navigator.canShare && navigator.canShare({ files: [imageFile] })) {
          navigator.share({
            files: [imageFile], title: 'My Sprite Collection Checklist', text: 'Check out my current Fortnite Sprite level status!'
          }).then(() => {
            targetElement.classList.remove("social-export-mode");
            exportBtn.innerText = "Export PNG Image";
          }).catch(err => {
            fallbackDownload(canvas, fileName);
            targetElement.classList.remove("social-export-mode");
            exportBtn.innerText = "Export PNG Image";
          });
        } else {
          fallbackDownload(canvas, fileName);
          targetElement.classList.remove("social-export-mode");
          exportBtn.innerText = "Export PNG Image";
        }
      }, "image/png");
    }).catch(err => {
      console.error("Image synthesis failed:", err);
      targetElement.classList.remove("social-export-mode");
      exportBtn.innerText = "Error! Try Again";
    });
  }, 120);
}

function fallbackDownload(canvas, fileName) {
  const link = document.createElement("a");
  link.download = fileName;
  link.href = canvas.toDataURL("image/png");
  link.click();
}

    if (sId === "aura") return `Images/IMG_0471.webp`;
    if (sId === "punk") return `Images/IMG_1091.webp`;
  }
  if (v === "holofoil") {
    if (sId === "water") return `Images/IMG_0472.webp`;
    if (sId === "fire") return `Images/IMG_0473.webp`;
    if (sId === "ghost") return `Images/IMG_0474.webp`;
    if (sId === "king") return `Images/IMG_0475.webp`;
    if (sId === "striker") return `Images/IMG_0476.webp`;
    if (sId === "air") return `Images/IMG_0477.webp`;
    if (sId === "seven") return `Images/IMG_0478.webp`;
    if (sId === "grimreaper") return `Images/IMG_1089.webp`;
    if (sId === "zeropoint") return `Images/IMG_1090.webp`;
  }
  return null;
}

// Season 4 art lives in Images2/. The ORIGINAL 19 sprites (74 images total)
// were uploaded in one uninterrupted batch and map sequentially to
// IMG_2613.webp through IMG_2686.webp, in this exact original order/variant
// order. This frozen list must NOT be edited going forward — it exists only
// to preserve that original sequential mapping even as SEASON4_SPRITES above
// keeps growing with new content batches.
const SEASON4_SPRITES_ORIGINAL_ORDER = [
  { id: "jonesy4", variants: ["normal","gold","cheatmaster","loothacker"] },
  { id: "adventure4", variants: ["normal","gold","cheatmaster","loothacker"] },
  { id: "bush4", variants: ["normal","gold","cheatmaster","loothacker"] },
  { id: "sonic4", variants: ["normal","gold","cheatmaster","loothacker"] },
  { id: "tails4", variants: ["normal","gold","cheatmaster","loothacker"] },
  { id: "shadow4", variants: ["normal","gold","cheatmaster","loothacker"] },
  { id: "8bit4", variants: ["normal","gold","cheatmaster","loothacker"] },
  { id: "jackrabbit4", variants: ["normal","gold","cheatmaster","loothacker"] },
  { id: "crown4", variants: ["normal","gold","cheatmaster","loothacker","bountyhacker"] },
  { id: "killswitch4", variants: ["normal","gold","cheatmaster","loothacker"] },
  { id: "klombo4", variants: ["normal","gold","cheatmaster","loothacker"] },
  { id: "megaman4", variants: ["normal"] },
  { id: "overshield4", variants: ["normal","gold","cheatmaster","loothacker"] },
  { id: "xray4", variants: ["normal","gold","cheatmaster","loothacker"] },
  { id: "onigiri4", variants: ["normal","gold","cheatmaster","loothacker"] },
  { id: "stormscout4", variants: ["normal","gold","cheatmaster","loothacker"] },
  { id: "blinky4", variants: ["normal","gold","cheatmaster","loothacker"] },
  { id: "crashbandicoot4", variants: ["normal","gold","cheatmaster","loothacker"] },
  { id: "pond4", variants: ["normal","gold","cheatmaster","loothacker"] }
];

const S4_IMAGE_START = 2613;
const S4_IMAGE_MAP = {};
(function buildS4ImageMap() {
  let n = S4_IMAGE_START;
  SEASON4_SPRITES_ORIGINAL_ORDER.forEach(s => {
    S4_IMAGE_MAP[s.id] = {};
    s.variants.forEach(v => {
      S4_IMAGE_MAP[s.id][v] = `Images2/IMG_${n}.webp`;
      n++;
    });
  });

  // New "Bounty Hunter" variant added to 17 existing sprites — uploaded as
  // one batch, IMG_2905.webp through IMG_2921.webp, in this exact order.
  const BOUNTY_HUNTER_ORDER = [
    "jonesy4","adventure4","bush4","sonic4","tails4","shadow4","8bit4",
    "jackrabbit4","killswitch4","klombo4","overshield4","xray4","onigiri4",
    "stormscout4","blinky4","crashbandicoot4","pond4"
  ];
  let bh = 2905;
  BOUNTY_HUNTER_ORDER.forEach(id => {
    if (!S4_IMAGE_MAP[id]) S4_IMAGE_MAP[id] = {};
    S4_IMAGE_MAP[id]["bountyhunter"] = `Images2/IMG_${bh}.webp`;
    bh++;
  });

  // New sprite "Morgana" — Base/Gold/Cheat Master/Loot Hacker/Bounty Hunter,
  // IMG_2922.webp through IMG_2926.webp in that order.
  S4_IMAGE_MAP["morgana4"] = {
    normal: "Images2/IMG_2922.webp",
    gold: "Images2/IMG_2923.webp",
    cheatmaster: "Images2/IMG_2924.webp",
    loothacker: "Images2/IMG_2925.webp",
    bountyhunter: "Images2/IMG_2926.webp"
  };
})();

function getImagePathS4(sId, v) {
  return (S4_IMAGE_MAP[sId] && S4_IMAGE_MAP[sId][v]) || `Images2/IMG_${S4_IMAGE_START}.webp`;
}

function render() {
  const app = document.getElementById("app");
  const isS4 = state.season === "s4";
  const showCodes = isS4 && state.view === "codes";

  let cardsHtml = "";
  let totalPointsPossible = 0;
  let currentPointsEarned = 0;
  let missingLabel = "";

  if (showCodes) {
    let claimedCount = 0;
    cardsHtml = CODE_CATEGORIES.map(cat => {
      const items = LOBBY_CODES.filter(c => c.category === cat);
      const rows = items.map(c => {
        const claimed = !!state.codes[c.code];
        if (claimed) claimedCount++;
        return `<div class="code-row ${claimed ? "claimed" : ""}" onclick="toggleCode('${c.code}')">
            <div class="code-check">${claimed ? "✓" : ""}</div>
            <div class="code-info">
              <div class="code-text">${c.code}</div>
              <div class="code-reward">${c.reward}</div>
            </div>
          </div>`;
      }).join("");
      return `<div class="sprite-card">
          <div class="sprite-info"><div class="sprite-name">${cat}</div></div>
          <div class="codes-list">${rows}</div>
        </div>`;
    }).join("");

    totalPointsPossible = LOBBY_CODES.length;
    currentPointsEarned = claimedCount;
    const missingCodes = LOBBY_CODES.filter(c => !state.codes[c.code]).map(c => c.code);
    missingLabel = missingCodes.length
      ? `Still unclaimed: ${missingCodes.slice(0, 3).join(", ")}${missingCodes.length > 3 ? "..." : ""}`
      : "All Lobby Hack codes claimed! 🎉";
  } else {
    let rawList;
    if (isS4) {
      rawList = SEASON4_SPRITES;
    } else {
      rawList = state.sortMode === "fortnite" ? SPRITES_FORTNITE : SPRITES_ORGANIZE;
    }
    const inv = getActiveInventory();

    let activeList = [];
    rawList.forEach(s => {
      let filteredVariants = s.variants.filter(v => {
        if (!isS4 && !state.showUnreleased && isUnreleased(s.id, v)) return false;
        return true;
      });
      if (filteredVariants.length > 0) {
        activeList.push({ id: s.id, name: s.name, rarity: s.rarity, variants: filteredVariants });
      }
    });

    let imageCounter = 383;

    activeList.forEach(s => {
      s.variants.forEach(v => {
        totalPointsPossible += 5;
        if (!inv[s.id]) inv[s.id] = {};
        let lvl = inv[s.id][v] || 0;
        currentPointsEarned += lvl;
      });
    });

    const missingNames = activeList.filter(s => s.variants.some(v => (inv[s.id][v] || 0) < 5)).map(s => s.name);
    missingLabel = missingNames.length ? `Still leveling: ${missingNames.slice(0, 3).join(", ")}${missingNames.length > 3 ? "..." : ""}` : "All styles fully Maxed! 🎉";

    cardsHtml = activeList.map(s => {
      const isSingle = s.variants.length === 1;
      const cells = s.variants.map(v => {
        if (!inv[s.id]) inv[s.id] = {};
        let lvl = inv[s.id][v] || 0;
        let btnClass = "";
        let labelText = "✕ NEED";
        if (!isSingle) labelText = v;
        if (lvl > 0) { btnClass = "have " + v; labelText = "LVL " + lvl; if (!isSingle) labelText = v.toUpperCase() + " L" + lvl; }
        if (lvl === 5) { btnClass = "max-lvl " + v; labelText = v.toUpperCase() + " MAX"; if (isSingle) labelText = "MAX"; }

        let imagePath = isS4 ? getImagePathS4(s.id, v) : getImagePath(s.id, v);

        if (!isS4 && !imagePath) {
          const currentImgNum = String(imageCounter).padStart(4, '0');
          imagePath = `Images/IMG_${currentImgNum}.webp`;
        }

        if (!isS4 && v !== "gem" && v !== "holofoil" && v !== "cube" && v !== "quack"
            && s.id !== "air" && s.id !== "seven" && s.id !== "batman"
            && s.id !== "pollo" && s.id !== "vinijr" && s.id !== "johnwick"
            && s.id !== "lootinllama" && s.id !== "peekypeely" && s.id !== "ironmouse") {
          imageCounter++;
        }

        return `<div class="toggle ${btnClass}" data-sprite="${s.id}" data-variant="${v}">
            <img class="variant-icon" src="${imagePath}" onerror="this.style.opacity='0.15';" alt="">
            <div class="toggle-label">${labelText}</div>
          </div>`;
      }).join("");

      const variantsJsonStr = JSON.stringify(s.variants).replace(/"/g, '&quot;');
      const rarityHtml = s.rarity ? `<div class="sprite-rarity rarity-${s.rarity.toLowerCase()}">${s.rarity}</div>` : "";

      return `<div class="sprite-card">
          <div class="sprite-info">
            <div class="sprite-name-wrap">
              <div class="sprite-name">${s.name}</div>
              ${rarityHtml}
            </div>
            <button class="max-row-btn" onclick='maxEntireRow("${s.id}", ${variantsJsonStr})'>MAX ROW</button>
          </div>
          <div class="variants-row">${cells}</div>
        </div>`;
    }).join("");
  }

  const pct = totalPointsPossible > 0 ? Math.round((currentPointsEarned / totalPointsPossible) * 100) : 0;

  const sheetOptions = Object.keys(appState.profiles).map(id => {
    const prof = appState.profiles[id];
    return `<option value="${id}" ${id === appState.activeId ? "selected" : ""}>📋 ${prof.username || "Unnamed Sheet"}</option>`;
  }).join("");

  const discordUser = JSON.parse(localStorage.getItem("discord_user"));
  let discordUI = discordUser 
    ? `<div class="discord-status">Linked to Discord: <strong>${discordUser.username}</strong></div>`
    : `<a href="https://discord.com/oauth2/authorize?client_id=1533044841611792464&response_type=code&redirect_uri=https%3A%2F%2Fsprites.tyrantnetworks.com%2F&scope=identify" class="discord-login-btn">Link Discord Account</a>`;

  const seasonRow = `<div class="sheet-manager">
      <select class="season-selector" onchange="switchSeason(this.value)">
        <option value="s3" ${state.season === "s3" ? "selected" : ""}>🕹️ Chapter 7 · Season 3</option>
        <option value="s4" ${state.season === "s4" ? "selected" : ""}>⚡ Chapter 7 · Season 4: Override</option>
      </select>
    </div>`;

  const s3Controls = `
    <div class="sheet-manager">
      <select class="sort-selector" onchange="updateSortMode(this.value)">
        <option value="organize" ${state.sortMode === 'organize' ? 'selected' : ''}>📂 Organize Order (Default)</option>
        <option value="fortnite" ${state.sortMode === 'fortnite' ? 'selected' : ''}>🎮 Fortnite’s Order</option>
      </select>
    </div>
    <div class="toggle-bar">
      <span>Show Unreleased Sprites</span>
      <label class="switch">
        <input type="checkbox" id="unreleasedToggle" ${state.showUnreleased ? 'checked' : ''} onchange="toggleUnreleased()">
        <span class="slider"></span>
      </label>
    </div>`;

  const s4Tabs = `<div class="tab-row">
      <button class="tab-btn ${state.view === 'sprites' ? 'active' : ''}" onclick="switchView('sprites')">🎯 Sprites</button>
      <button class="tab-btn ${state.view === 'codes' ? 'active' : ''}" onclick="switchView('codes')">🔑 Lobby Hack Codes</button>
    </div>`;

  const eyebrowText = isS4 ? "Fortnite · Chapter 7 Season 4: Override" : "Fortnite · Chapter 7 Season 3";
  const hintText = showCodes ? "Tap a code to mark it claimed." : "Tap tiles to cycle level. Hold down a tile or tap \"MAX ROW\" to instantly hit Level 5!";

  app.innerHTML = `
    <div class="discord-panel">${discordUI}</div>

    <div class="sheet-manager">
      <select class="sheet-selector" onchange="switchSheet(this.value)">${sheetOptions}</select>
      <button class="sheet-btn" onclick="newSheet()">+ New Sheet</button>
      <button class="sheet-btn delete" onclick="deleteSheet()" title="Delete Sheet">✕</button>
    </div>

    ${seasonRow}
    ${isS4 ? s4Tabs : s3Controls}

    <div class="hint">${hintText}</div>

    <div class="export-container" id="capture-area">
      <div class="header">
        <div class="title-block">
          <div class="eyebrow">${eyebrowText}</div>
          <h1>${showCodes ? "LOBBY HACK CODES" : "SPRITE CHECKLIST"}</h1>
        </div>
        <div class="epic-tag">
          <div class="label">Epic Username</div>
          <input type="text" class="username-input" value="${state.username}" oninput="updateUsername(this.value)" placeholder="Type Username...">
          <div class="username-static" id="username-mirror">${state.username || "PLAYER"}</div>
        </div>
      </div>
      <div class="sprites-grid">${cardsHtml}</div>
      <div class="legend-bar">
        <div class="link-group">
          <a href="https://buymeacoffee.com/benitopak96" target="_blank" class="tip-link">☕ Support the Dev</a>
          <a href="https://discord.gg/sfat9mcv73" target="_blank" class="tip-link discord-link">💬 Join Discord</a>
        </div>
        <button class="reset-btn" onclick="resetAll()">Reset</button>
      </div>
      <div class="footer-bar">
        <div>
          <div class="progress-label">${missingLabel}</div>
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        </div>
        <div class="cta">Got what I need? Comment your name & add <span id="cta-username">${state.username || "[Input Username]"}</span></div>
      </div>
      <div class="export-watermark">Track your collection at <span>sprites.tyrantnetworks.com</span></div>
    </div>
    <button class="export-btn" onclick="exportAsImage()">Export PNG Image</button>
  `;

  document.querySelectorAll('.toggle').forEach(element => {
    setupTouchListeners(element, element.getAttribute('data-sprite'), element.getAttribute('data-variant'));
  });
}

// --- INITIALIZATION & OAUTH ENGINE ---
const urlParams = new URLSearchParams(window.location.search);
const authCode = urlParams.get('code');

if (authCode) {
  document.getElementById('app').innerHTML = '<div class="loading">Authenticating with Discord...</div>';
  fetch("https://sapi.tyrantnetworks.com/auth/discord", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ code: authCode })
  })
  .then(response => response.json())
  .then(data => {
    if (data.user_id) {
      localStorage.setItem("discord_user", JSON.stringify(data));
      window.history.replaceState({}, document.title, window.location.pathname);
      loadState();
    }
  })
  .catch(error => {
    console.error("Discord Auth Failed:", error);
    window.history.replaceState({}, document.title, window.location.pathname);
    loadState();
  });
} else {
  loadState();
}
</script>
</body>
</html>
